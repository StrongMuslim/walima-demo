html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:17px;line-height:1.6;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background-image:var(--pat);pointer-events:none;z-index:0}
body.mono::before{display:none}
.inv{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:0 20px 40px;text-align:center}
a{color:inherit}
.s{padding:44px 0}
.h{font-family:var(--fd);font-weight:500;font-size:30px;line-height:1.15;letter-spacing:.01em;margin-bottom:16px;color:var(--ac)}
.kick,.cv-kicker{font-family:var(--fb);text-transform:uppercase;letter-spacing:.22em;font-size:12px;color:var(--mu)}
.muted,.note{color:var(--mu);font-size:15px}
.note{margin-top:14px;font-style:italic}
.lead{font-size:18px}
.card{position:relative;padding:34px 24px;border-radius:4px}
.card-outline .card{border:1px solid var(--ln);background:var(--sf);box-shadow:0 0 0 5px var(--bg),0 0 0 6px var(--ln)}
.card-arch .card{background:var(--sf);border:1px solid var(--ln);border-radius:200px 200px 6px 6px;padding-top:64px}
.card-plain .card{padding:10px 4px}
.ar{font-family:var(--fa);font-size:25px;line-height:2;color:var(--ac)}
.bism{font-size:30px;line-height:1.6}
.s-bism{padding:30px 0 0}
.tr{margin-top:12px;font-family:var(--fd);font-style:italic;font-size:19px;line-height:1.5}
.ref{margin-top:10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.dv{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ac);margin:14px auto}
.dv span{height:1px;width:56px;background:linear-gradient(90deg,transparent,var(--ac))}
.dv span:last-child{transform:scaleX(-1)}
.dv svg{width:20px;height:20px}
/* обложка */
.s-cover{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 0 60px;position:relative}
.cv-box{position:relative;width:min(88vw,400px);display:grid;place-items:center}
.cv-text{position:relative;z-index:2;padding:0 26px}
.names{font-family:var(--fs);font-weight:400;font-size:clamp(46px,14vw,66px);line-height:1.08;color:var(--ink);display:flex;flex-direction:column;align-items:center;margin-top:14px}
.kg{font-family:'Cormorant Garamond',var(--fd)!important;font-style:italic;font-weight:500;letter-spacing:0}
.names.kg{font-size:clamp(40px,12vw,56px);line-height:1.15}
.names .amp{font-size:.55em;color:var(--ac);line-height:1.2}
.cv-date{font-family:var(--fd);font-size:24px;letter-spacing:.14em}
.cv-wd{color:var(--mu);font-size:14px;letter-spacing:.08em;margin-top:2px}
.cv-arch .cv-box{aspect-ratio:300/470}
.arch{position:absolute;inset:0;width:100%;height:100%}
.a-fill{fill:var(--sf)}
.a-ln{fill:none;stroke:var(--ac);stroke-width:1.4;vector-effect:non-scaling-stroke}
.a-ln.thin{stroke-width:.8;opacity:.7}
.fin{position:absolute;top:-2.5%;left:50%;transform:translateX(-50%);color:var(--ac)}
.arch-fin{width:26px;height:26px}
.cv-arch .cv-text{padding-top:18%}
.cv-medallion .cv-box{aspect-ratio:1;width:min(92vw,420px)}
.medal{position:absolute;inset:0;width:100%;height:100%}
.m1{fill:var(--sf);stroke:var(--ac);stroke-width:1.2}.m2{fill:none;stroke:var(--ac);stroke-width:.8}.m3{fill:none;stroke:var(--ln);stroke-width:.6;stroke-dasharray:2 4}.m4{fill:var(--ac)}
.cv-plate .cv-box{aspect-ratio:1;width:min(92vw,420px)}
.cv-plate .cv-text,.cv-medallion .cv-text{padding:0 19%}
.cv-plate .names,.cv-medallion .names{font-size:clamp(34px,10vw,48px)!important;margin-top:8px}
.cv-plate .dv,.cv-medallion .dv{margin:8px auto}.cv-plate .cv-date,.cv-medallion .cv-date{font-size:20px}
.cv-out{margin:0 24px 22px;line-height:1.6}
.cv-ar{font-family:var(--fa);font-size:clamp(34px,10vw,46px);line-height:1.5;color:var(--ac);margin:0 0 6px}.cv-plate .names{font-size:clamp(40px,12vw,56px)}
.cv-medallion .names{font-size:clamp(40px,12vw,56px)}
.cv-frame .cv-box{padding:56px 10px;border:1px solid var(--ac);outline:1px solid var(--ln);outline-offset:-10px;background:var(--sf)}
.frame i{position:absolute;width:22px;height:22px;border:1px solid var(--ac);background:var(--bg);transform:rotate(45deg)}
.frame i:nth-child(1){top:-11px;left:-11px}.frame i:nth-child(2){top:-11px;right:-11px}.frame i:nth-child(3){bottom:-11px;left:-11px}.frame i:nth-child(4){bottom:-11px;right:-11px}
.folk .cv-frame .cv-box{border:8px solid transparent;border-image:var(--pat) 30 round;outline:2px solid var(--ac)}
.cv-typo .names{font-family:var(--fd);font-weight:400;font-size:clamp(48px,15vw,74px);letter-spacing:-.01em}
.cv-typo .names .amp{font-family:var(--fs);font-size:.7em}
.cv-typo .cv-box::before,.cv-typo .cv-box::after{content:"";display:block;width:1px;height:70px;background:var(--ac);margin:0 auto 20px}
.cv-typo .cv-box::after{margin:20px auto 0}
.cv-typo .cv-box{display:block}
.mono .cv-typo .names{font-size:clamp(52px,16vw,82px)}
.scroll{position:absolute;bottom:18px;left:50%;width:22px;height:36px;border:1px solid var(--ln);border-radius:12px;transform:translateX(-50%)}
.scroll span{position:absolute;top:7px;left:50%;width:3px;height:7px;margin-left:-1.5px;border-radius:2px;background:var(--ac);animation:sc 1.8s infinite}
@keyframes sc{0%{opacity:0;transform:translateY(0)}40%{opacity:1}100%{opacity:0;transform:translateY(12px)}}
.lanterns{position:absolute;inset:0 0 auto 0;height:180px;pointer-events:none;z-index:3}
.lantern{position:absolute;top:0;width:calc(34px*var(--sc));height:calc(78px*var(--sc));margin-top:calc(var(--len)*1);transform-origin:50% -100%;animation:sw 5s ease-in-out infinite alternate}
.lantern::before{content:"";}
.ls{stroke:var(--ac);fill:none;stroke-width:1}.lb{fill:var(--ac)}.lg{fill:var(--ac);fill-opacity:.25;stroke:var(--ac)}
@keyframes sw{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
/* дата */
.bigdate{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.bigdate .wd{text-transform:uppercase;letter-spacing:.24em;font-size:12px;color:var(--mu)}
.bigdate .dn{font-family:var(--fd);font-size:84px;line-height:1;color:var(--ac);margin:6px 0}
.bigdate .mo{font-family:var(--fd);font-size:22px;letter-spacing:.12em;text-transform:uppercase}
.tm{margin-top:12px;font-size:16px;color:var(--mu)}.tm b{color:var(--ink);font-family:var(--fd);font-size:24px;font-weight:500;margin-left:4px}
.cal{margin:24px auto 18px;max-width:300px}
.cal-m{font-family:var(--fd);font-size:18px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 0;font-size:14px}
.cal-g u{text-decoration:none;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.cal-g i,.cal-g b{font-style:normal;height:34px;display:grid;place-items:center;position:relative}
.cal-g b svg{position:absolute;inset:-2px;width:38px;height:38px;margin:auto;fill:var(--ac)}
.cal-g b em{position:relative;font-style:normal;color:var(--btn-ink);font-weight:600}
/* мужчины / женщины */
.sess{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.ses{border:1px solid var(--ln);background:var(--sf);border-radius:12px 12px 80px 80px;padding:22px 14px 30px}
.ses-w{text-transform:uppercase;letter-spacing:.2em;font-size:12px;color:var(--mu)}
.ses-t{font-family:var(--fd);font-size:42px;line-height:1.1;color:var(--ac);margin:6px 0 4px}
.ses-x{font-size:15px}.ses-n{margin-top:10px;font-size:13.5px;color:var(--mu);font-style:italic;line-height:1.35}
/* отсчёт */
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.cd div{border:1px solid var(--ln);border-radius:6px;padding:12px 0 8px;background:var(--sf)}
.cd b{display:block;font-family:var(--fd);font-weight:500;font-size:34px;line-height:1;color:var(--ac)}
.cd span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
/* программа */
.prog{list-style:none;text-align:left;max-width:340px;margin:8px auto 0;position:relative}
.prog::before{content:"";position:absolute;left:68px;top:10px;bottom:10px;width:1px;background:var(--ln)}
.prog li{display:grid;grid-template-columns:58px 1fr;gap:22px;padding:10px 0;position:relative}
.prog li::before{content:"";position:absolute;left:64px;top:19px;width:9px;height:9px;background:var(--ac);transform:rotate(45deg)}
.prog b{font-family:var(--fd);font-weight:500;font-size:21px;color:var(--ac);text-align:right}
/* место */
.v-ic{width:46px;height:46px;color:var(--ac);margin:0 auto 6px;display:block}
.place{font-family:var(--fd);font-size:25px;line-height:1.2}
.addr{color:var(--mu);margin-top:6px}
.maps{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border-radius:999px;background:var(--ac);color:var(--btn-ink);text-decoration:none;font:500 15px/1 var(--fb);letter-spacing:.03em;border:1px solid var(--ac);cursor:pointer;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ac)}
.date .btn,.card>.btn{margin-top:4px}
.btn.wide{width:100%}
/* особенности */
.rules{list-style:none;display:grid;gap:10px;max-width:380px;margin:0 auto;text-align:left}
.rules li{display:flex;align-items:center;gap:14px;padding:12px 16px;border:1px solid var(--ln);border-radius:10px;background:var(--sf)}
.rules svg{flex:none;width:26px;height:26px;color:var(--ac)}
/* дресс-код */
.sw{display:flex;gap:12px;justify-content:center;margin-top:18px}
.sw i{width:42px;height:42px;border-radius:50%;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--ln)}
/* контакты */
.contacts{display:grid;gap:18px}
.ct-n{font-family:var(--fd);font-size:22px}.ct-p{color:var(--mu);letter-spacing:.04em}
.ct .maps{margin-top:10px}
/* анкета */
.rsvp{display:grid;gap:12px;margin-top:8px;text-align:left}
.rsvp input[name=name],.rsvp textarea{width:100%;font:16px var(--fb);color:var(--ink);background:transparent;border:1px solid var(--ln);border-radius:10px;padding:13px 14px;outline:none}
.rsvp input[name=name]:focus,.rsvp textarea:focus{border-color:var(--ac)}
.rsvp ::placeholder{color:var(--mu);opacity:.85}
.seg{display:grid;gap:8px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0}
.seg span{display:block;padding:13px 14px;border:1px solid var(--ln);border-radius:10px;text-align:center;font-size:15px}
.seg input:checked+span{background:var(--ac);border-color:var(--ac);color:var(--btn-ink)}
.cnt{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px}
.cnt div{display:flex;align-items:center;gap:6px}
.cnt button{width:40px;height:40px;border-radius:50%;border:1px solid var(--ln);background:transparent;color:var(--ac);font-size:20px;cursor:pointer}
.cnt output{min-width:28px;text-align:center;font-family:var(--fd);font-size:22px}
.r-msg{text-align:center;font-size:15px;min-height:1px}
.r-msg.ok{color:var(--ac);font-family:var(--fd);font-size:20px}
.rsvp.done>:not(.r-msg):not(.again){display:none}
.again{justify-self:center;background:none;border:0;color:var(--mu);text-decoration:underline;font:14px var(--fb);cursor:pointer}
/* финал */
.s-final{padding-bottom:20px}
.fin-t{font-family:var(--fs);font-size:clamp(34px,10vw,46px);line-height:1.2;color:var(--ac)}
.fin-n{font-family:var(--fd);font-size:22px;margin-top:12px;display:flex;gap:8px;justify-content:center;align-items:baseline}
.fin-n .amp{color:var(--ac)}
.foot{position:relative;z-index:1;text-align:center;padding:26px 20px 34px;font-size:12px;color:var(--mu);letter-spacing:.06em}
.foot a{color:var(--ac);text-decoration:none;border-bottom:1px solid var(--ln)}
/* двери */
#doors{position:fixed;inset:0;z-index:50;display:grid;place-items:center;cursor:pointer}
#doors .d{position:absolute;top:0;bottom:0;width:50.5%;background:var(--bg2);background-image:var(--pat);transition:transform 1.25s cubic-bezier(.7,0,.25,1)}
#doors .d.l{left:0;border-right:1px solid var(--ac)}
#doors .d.r{right:0;border-left:1px solid var(--ac)}
#doors .d::after{content:"";position:absolute;top:12%;bottom:12%;width:70%;border:1px solid var(--ln);border-radius:400px 400px 0 0}
#doors .d.l::after{right:12%}#doors .d.r::after{left:12%}
#doors .seal{position:relative;z-index:2;display:grid;place-items:center;gap:14px;transition:opacity .4s}
#doors .seal b{width:104px;height:104px;display:grid;place-items:center;color:var(--ac);animation:pulse 2.4s ease-in-out infinite}
#doors .seal b svg{width:104px;height:104px}
#doors .seal small{font-family:var(--fb);text-transform:uppercase;letter-spacing:.2em;font-size:12px;color:var(--ink);background:var(--bg2);padding:6px 12px;border-radius:999px}
#doors.open .d.l{transform:translateX(-101%)}#doors.open .d.r{transform:translateX(101%)}#doors.open .seal{opacity:0}
#doors.gone{display:none}
@keyframes pulse{50%{transform:scale(1.06)}}
/* появление */
.js .rv{opacity:0;transform:translateY(18px);transition:opacity .9s ease,transform .9s ease}
.js .rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.js .rv{opacity:1;transform:none;transition:none}.lantern,.scroll span,#doors .seal b{animation:none}}
/* минимальные темы */
.minimal .card-plain .card,.minimal .card{border:0}
.thumb .s:not(.s-cover){display:none}.thumb .s-cover{min-height:100vh;padding:0}body.thumb::before{position:absolute}
`;

/* ───────────────────────── страница целиком ───────────────────────── */
// opts: { mode: 'live'|'preview'|'thumb', slug, api, botUrl, base }
function renderInviteV1(d, opts = {}) {
  let t = themeById(d.theme);
  // в узбекской кириллице нет ҳ у некоторых заголовочных шрифтов — подменяем на Cormorant
  if (d.lang === 'uzc' && NO_UZC.has(t.f.display)) t = { ...t, f: { ...t.f, display: 'Cormorant Garamond' } };
  if (d.lang === 'uzc' && NO_UZC.has(t.f.body)) t = { ...t, f: { ...t.f, body: 'Lora' } };
  _t = t;
  const L = L_(d.lang);
  const thumb = opts.mode === 'thumb';
  const o = { ...opts, thumb };
  const blocks = (d.blocks || []).filter((b) => b.on && BLOCKS[b.type]);
  const body = blocks.map((b) => section(b, d, t, L, o)).join('\n');
  const title = coupleTitle(d) || 'Walima';
  const p = parts(d);
  const desc = `${L.events[d.event] || ''}${p ? ' · ' + String(p.day).padStart(2, '0') + '.' + String(p.m).padStart(2, '0') + '.' + p.y : ''}`;
  const sealSvg = `<svg viewBox="0 0 100 100"><polygon points="${star8(50, 50, 48, 40)}" fill="var(--bg2)" stroke="currentColor" stroke-width="1.2"/><polygon points="${star8(50, 50, 38, 32)}" fill="none" stroke="currentColor" stroke-width=".7"/><circle cx="50" cy="50" r="22" fill="currentColor" opacity=".14"/><text x="50" y="58" text-anchor="middle" font-family="${kg(initials(d)) ? 'Cormorant Garamond' : t.f.script}"${kg(initials(d)) ? ' font-style="italic"' : ''} font-size="26" fill="currentColor">${esc(initials(d))}</text></svg>`;
  const doors = !thumb && d.intro !== false ? `<div id="doors" role="button" tabindex="0" aria-label="${L.open}"><div class="d l"></div><div class="d r"></div><div class="seal"><b>${sealSvg}</b><small>${L.tapHint}</small></div></div>` : '';
  const cfg = { slug: opts.slug || '', api: opts.api || '', mode: opts.mode || 'live', date: d.date, time: d.time, tz: MARKETS[marketOf(d)].tz, L: { thanks: L.rsvpThanks, again: L.rsvpAgain, prev: L.rsvpPreview, need: L.rsvpNeedName, err: L.rsvpErr, done: L.cdDone } };
  const foot = thumb ? '' : `<footer class="foot">${L.madeWith} · <a href="${esc(opts.botUrl || '#')}" target="_blank" rel="noopener">Walima — ${L.makeOwn}</a></footer>`;
  const og = opts.base ? `<meta property="og:title" content="${esc(title)}"><meta property="og:description" content="${esc(desc)}"><meta property="og:type" content="website">${opts.slug ? `<meta property="og:image" content="${esc(opts.base)}/og/${marketOf(d)}-${esc(t.id)}.jpg"><meta property="og:url" content="${esc(opts.base)}/i/${esc(opts.slug)}">` : ''}` : '';
  return `<!doctype html><html lang="${{ ru: 'ru', ky: 'ky', uz: 'uz', uzc: 'uz-Cyrl' }[d.lang] || 'uz'}"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>${esc(title)} — ${esc(L.events[d.event] || '')}</title><meta name="description" content="${esc(desc)}"><meta name="theme-color" content="${t.c.bg}">${og}
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="${fontsHrefSafe([t])}">
<style>${themeVars(t)}${BASE_CSS}</style></head>
<body class="t-${t.id} card-${t.card}${t.mono ? ' mono' : ''}${t.minimal ? ' minimal' : ''}${t.folk ? ' folk' : ''}${thumb ? ' thumb' : ''}">
${doors}<main class="inv">${body}</main>${foot}
${thumb ? '' : `<script>window.WALIMA=${JSON.stringify(cfg).replace(/</g, '\\u003c')};<\/script><script>${CLIENT_JS}<\/script>`}
</body></html>`;
}
function initials(d) {
  const g = (d.groom || '').trim()[0] || '', b = (d.bride || '').trim()[0] || '';
  if (d.nameMode === 'groom' || !b) return g;
  if (BRIDE_EVENTS.has(d.event)) return b;
  return g + '&' + b;
}

/* ───────────────────────── картинка для превью ссылки (1200×630) ───────────────────────── */
// Общая для шаблона, без имён: tools/og.mjs снимает её в public/og/<id>.png
function ogHtml(themeId, market = 'kg') {
  const t = themeById(themeId); _t = t;
  const W = market === 'uz' ? { l: ['Nikoh', 'Unashtiruv'], r: ['Toʻy', 'Nahor'], big: 'Toʻyga<br>taklifnoma', sub: 'Приглашение на той' } : { l: ['Нике', 'Никах'], r: ['Той', 'Валима'], big: 'Тойго<br>чакыруу', sub: 'Приглашение на торжество' };
  return `<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="${fontsHrefSafe([t])}">
<style>${themeVars(t)}*{margin:0;box-sizing:border-box}html,body{width:1200px;height:630px;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 55%,var(--bg) 0%,var(--bg2) 100%);color:var(--ink);font-family:var(--fb);position:relative;display:grid;place-items:center}
body::before{content:"";position:absolute;inset:0;background-image:var(--pat)}
.box{position:relative;width:440px;height:600px;margin-top:60px;display:grid;justify-items:center;align-content:center;text-align:center;padding:120px 40px 40px}
.box svg.arch{position:absolute;inset:0;width:100%;height:100%}
.a-fill{fill:var(--sf)}.a-ln{fill:none;stroke:var(--ac);stroke-width:2}.a-ln.thin{stroke-width:1;opacity:.7}
.bism{font-family:var(--fa);font-size:34px;color:var(--ac);direction:rtl;margin-bottom:14px}
.k{text-transform:uppercase;letter-spacing:.3em;font-size:15px;color:var(--mu)}
.big{font-family:'Cormorant Garamond',var(--fd);font-style:italic;font-weight:500;font-size:62px;line-height:1.05;color:var(--ink);margin:14px 0 8px}
.ru{font-family:var(--fd);font-size:24px;color:var(--ac);letter-spacing:.04em}
.side{position:absolute;top:50%;transform:translateY(-50%);width:300px;text-align:center;font-family:var(--fd);color:var(--ac);font-size:22px;letter-spacing:.2em;text-transform:uppercase;opacity:.9}
.side.l{left:70px}.side.r{right:70px}.side b{display:block;width:60px;height:1px;background:var(--ac);margin:18px auto}
</style></head><body><div class="side l">${esc(W.l[0])}<b></b>${esc(W.l[1])}</div><div class="side r">${esc(W.r[0])}<b></b>${esc(W.r[1])}</div>
<div class="box">${ARCH}<div style="position:relative"><p class="bism">${BISMILLAH}</p><p class="k">Walima</p><p class="big">${W.big.replace(/ʻ/g, '‘')}</p><p class="ru">${W.sub}</p></div></div></body></html>`;
}

        ${t.mono ? '<p class="cv-ar" lang="ar" dir="rtl">بَارَكَ اللَّهُ لَكُمَا</p>' : ''}${round ? '' : `<p class="cv-ev">${esc(ev)}</p>`}${namesPart}
        ${F ? `<p class="cv-date">${esc(F.day)}, ${F.year}</p><p class="cv-wd">${esc(F.wd)}, ${ctx.rows.length > 1 ? ctx.rows.map((x) => `${esc(x.who.toLowerCase())} ${esc(x.time)}`).join(', ') : `${esc(g.at)} ${esc(d.time || '')}`}</p>` : ''}</div></div>
        ${o.thumb ? '' : `<div class="hint" aria-hidden="true">${esc(g.scroll)}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>`}</section>`;
    }
    case 'ayah': {
      const a = AYAHS[b.which] || AYAHS.rum21;
      const words = a.ar.split(' ').map((w) => `<span>${w}</span>`).join(' ');
      return `<section class="ay" data-scrub="ay"><svg class="ay-orn" viewBox="0 0 120 24" aria-hidden="true"><path d="M0 12H46M74 12H120"/><polygon points="${star8(60, 12, 10, 6)}"/></svg>
        <p class="ay-ar" lang="ar" dir="rtl">${words}</p><p class="ay-tr">${esc(ayahText(a, d.lang))}</p><p class="ay-ref">${esc(ayahRef(a, d.lang))}</p></section>`;
    }
    case 'invite': {
      const hosts = ctx.hosts;
      return `<section class="lt"><div class="paper" data-in>${b.title ? `<p class="lt-to">${esc(b.title)}</p>` : ''}
        <p class="lt-body">${nl(inviteText(b.text, d))}</p>
        ${hosts ? `<p class="lt-sign"><span>${esc(hosts.title || g.sign)}</span><b class="${kg(hosts.text).trim()}">${nl(hosts.text)}</b></p>` : ''}</div></section>`;
    }
    case 'hosts':
      return ctx.hostsInLetter ? '' : `<section class="hs"><p class="lt-sign"><span>${esc(b.title || g.sign)}</span><b>${nl(b.text)}</b></p></section>`;
    case 'date': {
      if (!F) return '';
      const gc = gcalUrl(d, coupleTitle(d) + ' — ' + (L.events[d.event] || ''), ctx.place);
      return `<section class="dt">${b.title ? `<h2 class="h">${esc(b.title)}</h2>` : ''}<div class="dt-row">
        <div class="leaf" data-in><div class="rings"><i></i><i></i></div><p class="lf-m">${esc(F.month)} ${F.year}</p><p class="lf-d">${F.p.day}</p><p class="lf-w">${esc(F.wd)}</p>
          <svg class="stamp" viewBox="0 0 80 80" aria-hidden="true"><polygon points="${star8(40, 40, 38, 31)}"/><polygon points="${star8(40, 40, 29, 23)}" class="st-in"/><circle cx="40" cy="40" r="6" class="st-dot"/></svg></div>
        <div class="dt-side">${ctx.rows.length > 1 ? `<div class="dt-rows">${ctx.rows.map((x) => `<p><span>${esc(x.who)}</span><b>${esc(x.time)}</b></p>`).join('')}</div>` : `<p class="dt-t">${esc(g.at)}</p><p class="dt-h">${esc(d.time || '')}</p>`}
          ${gc && !o.thumb ? `<a class="lnk" href="${esc(gc)}" target="_blank" rel="noopener">${icon('cal')}${esc(g.addCal)}</a>` : ''}</div></div>
        ${b.calendar ? calendarHtml(F.p, L) : ''}</section>`;
    }
    case 'sessions': {
      const rows = ctx.rows;
      if (!rows.length) return '';
      // дуга дня: отметки на своих местах по времени, солнце проходит их по очереди
      const P = (f) => { const t2 = f, x = (1 - t2) ** 2 * 24 + 2 * (1 - t2) * t2 * 170 + t2 ** 2 * 316, y = (1 - t2) ** 2 * 140 + 2 * (1 - t2) * t2 * -40 + t2 ** 2 * 140; return [x.toFixed(1), y.toFixed(1)]; };
      const marks = rows.map((r) => { const [x, y] = P(dayFrac(r.time)); return `<g class="mk mk-${r.cls}"><circle cx="${x}" cy="${y}" r="5"/><text x="${x}" y="${(+y - 12).toFixed(1)}" text-anchor="middle">${esc(r.time)}</text></g>`; }).join('');
      const arc = rows.length > 1 ? `<svg class="sky" viewBox="0 0 340 150" aria-hidden="true" data-from="${dayFrac(rows[0].time)}" data-to="${dayFrac(rows[rows.length - 1].time)}">
        <path d="M24 140Q170 -40 316 140" class="sky-p" id="skyp"/>${marks}
        <g class="sun"><circle r="10"/>${Array.from({ length: 8 }, (_, i) => `<path d="M0 -15V-20" transform="rotate(${45 * i})"/>`).join('')}</g>
        <path d="M0 146H340" class="sky-h"/></svg>` : '';
      const col = (r) => `<div class="ss-c ${r.cls}"><p class="ss-w">${esc(r.who)}</p><p class="ss-t">${esc(r.time)}</p>${r.text ? `<p class="ss-x">${esc(r.text)}</p>` : ''}${r.note ? `<p class="ss-n">${esc(r.note)}</p>` : ''}</div>`;
      return `<section class="ss" data-scrub="sun">${b.title ? `<h2 class="h">${esc(b.title)}</h2>` : ''}${arc}<div class="ss-row n${rows.length}">${rows.map(col).join('')}</div></section>`;
    }
    case 'countdown':
      if (!F) return '';
      return `<section class="cd-s"><p class="cd-k">${esc(L.cd)}</p><div class="cd" data-cd>${L.cdUnits.map((u, i) => `<div><b data-u="${i}">0</b><span>${esc(u)}</span></div>`).join('')}</div></section>`;
    case 'program': {
      const items = (b.items || []).filter((x) => x.time || x.text);
      if (!items.length) return '';
      return `<section class="pg" data-scrub="tl">${b.title ? `<h2 class="h">${esc(b.title)}</h2>` : ''}<div class="tl"><i class="tl-line"><i></i></i>
        ${items.map((x) => `<div class="tl-it"><b>${esc(x.time)}</b><span>${esc(x.text)}</span></div>`).join('')}</div></section>`;
    }
    case 'venue': {
      const q = [b.place, b.address].filter(Boolean).join(', ');
      const link = safeUrl(b.map);
      const mk = MARKETS[marketOf(d)];
      const btns = o.thumb ? '' : link ? `<a class="btn" href="${esc(link)}" target="_blank" rel="noopener">${icon('route')}${esc(g.route)}</a>`
        : q ? mk.maps.map((m, i) => `<a class="btn${i ? ' ghost' : ''}" href="${MAP_URL[m](q)}" target="_blank" rel="noopener">${i ? '' : icon('route')}${MAP_NAME[m]}</a>`).join('') : '';
      return `<section class="vn">${b.title ? `<h2 class="h">${esc(b.title)}</h2>` : ''}<div class="vn-card" data-in><div class="map">${mapSvg(q)}
        <svg class="pin" viewBox="0 0 40 52" aria-hidden="true"><path d="M20 51C20 51 2 32 2 19A18 18 0 0 1 38 19C38 32 20 51 20 51Z"/><polygon points="${star8(20, 19, 8, 4.5)}" class="pin-s"/></svg><i class="pulse"></i></div>
        <div class="vn-b">${b.place ? `<p class="vn-p">${esc(b.place)}</p>` : ''}${b.address ? `<p class="vn-a">${nl(b.address)}</p>` : ''}<div class="btns">${btns}</div></div></div></section>`;
    }
    case 'rules': {
      const items = (b.items || []).filter((k) => L.rules[k]);
      if (!items.length && !b.note) return '';
      return `<section class="ru">${b.title ? `<h2 class="h">${esc(b.title)}</h2>` : ''}<ul class="chips">${items.map((k) => `<li>${icon(k)}<span>${esc(L.rules[k])}</span></li>`).join('')}</ul>${b.note ? `<p class="note">${nl(b.note)}</p>` : ''}</section>`;
    }
    case 'dress': {
      const cols = (b.colors || []).filter((c) => /^#[0-9a-f]{6}$/i.test(c)).slice(0, 5);
      return `<section class="dr-s">${b.title ? `<h2 class="h">${esc(b.title)}</h2>` : ''}${b.text ? `<p class="txt">${nl(b.text)}</p>` : ''}${cols.length ? `<div class="sw">${cols.map((c, i) => `<i style="background:${c};--i:${i}"></i>`).join('')}</div>` : ''}</section>`;
    }
    case 'contacts': {
      const items = (b.items || []).filter((x) => x.phone || x.name);
      if (!items.length) return '';
      return `<section class="ct">${b.title ? `<h2 class="h">${esc(b.title)}</h2>` : ''}${items.map((x) => {
        const dg = String(x.phone || '').replace(/\D/g, '');
        return `<div class="ct-r"><div><p class="ct-n">${esc(x.name)}</p><p class="ct-p">${esc(x.phone)}</p></div>${dg && !o.thumb ? `<div class="ct-b"><a href="tel:+${dg}" aria-label="${esc(g.call)}">${icon('phone')}</a><a href="https://t.me/+${dg}" target="_blank" rel="noopener" aria-label="Telegram">${icon('tg')}</a></div>` : ''}</div>`;
      }).join('')}</section>`;
    }
    case 'rsvp':
      return `<section class="rs" id="rsvp">${b.title ? `<h2 class="h">${esc(b.title)}</h2>` : ''}${b.deadline ? `<p class="note">${esc(b.deadline)}</p>` : ''}
        <form class="rsf" data-rsvp novalidate><div class="rs-ch"><button type="button" class="big y" data-att="1">${esc(g.yes)}</button><button type="button" class="big n" data-att="0">${esc(g.no)}</button></div>
        <div class="rs-more"><label class="fl"><span>${esc(g.yourName)}</span><input name="name" maxlength="80" autocomplete="name"></label>
          ${b.count ? `<div class="cnt" data-cnt><span>${esc(g.count)}</span><div><button type="button" data-d="-1" aria-label="−">−</button><output>1</output><button type="button" data-d="1" aria-label="+">+</button></div></div>` : ''}
          <label class="fl"><span>${esc(g.duo)}</span><textarea name="msg" maxlength="500" rows="3"></textarea></label>
          <button class="btn wide" type="submit">${esc(g.send)}</button><p class="r-msg" role="status"></p></div>
        ${o.thumb ? '' : `<p class="rs-priv">${esc(g.privA)} <a href="/maxfiylik" target="_blank" rel="noopener">${esc(g.privB)}</a></p>`}
        <div class="rs-done"><svg viewBox="0 0 80 80" aria-hidden="true"><polygon points="${star8(40, 40, 36, 28)}"/><path d="M27 41l9 9 17-19"/></svg><p class="rs-t"></p><button type="button" class="again">${esc(g.change)}</button></div></form></section>`;
    case 'text':
      if (!b.title && !b.text) return '';
      return `<section class="tx">${b.title ? `<h2 class="h">${esc(b.title)}</h2>` : ''}${b.text ? `<p class="txt">${nl(b.text)}</p>` : ''}</section>`;
    case 'final':
      return `<section class="fn"><svg class="fn-orn" viewBox="0 0 200 40" aria-hidden="true"><path d="M0 20H80M120 20H200"/><polygon points="${star8(100, 20, 16, 10)}"/></svg>
        <p class="fn-t${kg(b.text)}">${esc(b.text || '')}</p>${namesSvg(d, t).replace('class="nm', 'class="nm sm')}</section>`;
    default:
      return '';
  }
}

// Кайма для обложки «band»: тот же узор темы, но яркий
function bandPat(t) {
  if (!['adras', 'chapan', 'gilam', 'paxtagul'].includes(t.pattern)) return 'none';
  return patternCss(t).replace(/opacity%3D'\.\d+'/, "opacity%3D'.95'").replace(/opacity='\.\d+'/, "opacity='.95'");
}

  $('al').hidden = cur === 0; $('ar').hidden = cur === FL.length - 1;
}
function openFs(n) {
  FL = LISTS[S.tab]; if (!FL.length) return;
  cur = Math.max(0, Math.min(n, FL.length - 1)); busy = false;
  place(slot.prev, -1, false); place(slot.cur, 0, false); place(slot.next, 1, false);
  for (const p of panes) p.dataset.i = '';
  fill(slot.cur, cur); fillNeighbors(700); bar();
  fsOpen = true; fs.setAttribute('aria-hidden', 'false'); document.documentElement.classList.add('lock');
  requestAnimationFrame(() => fs.classList.add('on')); syncHearts();
  try { history.pushState({ wdfs: 1 }, '', '#view'); histOn = true; } catch (e) { histOn = false; }
  $('fx').focus({ preventScroll: true });
}
function closeFs(fromPop) {
  if (!fsOpen) return;
  fsOpen = false; fs.classList.remove('on'); fs.setAttribute('aria-hidden', 'true'); clearTimeout(nbT);
  document.documentElement.classList.remove('lock');
  setTimeout(() => { if (!fsOpen) for (const p of panes) { p.textContent = ''; p.dataset.i = ''; } }, 360);
  if (histOn && !fromPop) { try { history.back(); } catch (e) {} }
  histOn = false; syncHearts();
}
function go(dir) {
  const n = cur + dir; if (!fsOpen || busy || n < 0 || n >= FL.length) return;
  busy = true; clearTimeout(nbT);
  const old = slot.cur, tgt = dir > 0 ? slot.next : slot.prev, far = dir > 0 ? slot.prev : slot.next;
  fill(tgt, n);
  place(old, -dir, true); place(tgt, 0, true);
  setTimeout(() => {
    cur = n; place(far, dir, false); far.dataset.i = ''; far.textContent = '';
    slot = dir > 0 ? { prev: old, cur: tgt, next: far } : { next: old, cur: tgt, prev: far };
    busy = false; bar(); fillNeighbors(450);
  }, 360);
}
$('fx').addEventListener('click', () => closeFs(false));
$('al').addEventListener('click', () => go(-1));
$('ar').addEventListener('click', () => go(1));
$('fh').addEventListener('click', () => toggleLike(FL[cur].id));
$('fl').addEventListener('click', () => setLang(LANGS[(LANGS.indexOf(S.lang) + 1) % 3]));
window.addEventListener('popstate', () => closeFs(true));
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if ($('sh').classList.contains('on')) closeSheet(); else closeFs(false); }
  if (!fsOpen) return;
  if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1);
});
window.addEventListener('message', (e) => {
  const d = e.data;
  if (!fsOpen || !d || !d.walimaSwipe) return;
  const f = slot.cur.firstChild;
  if (f && e.source === f.contentWindow) go(d.walimaSwipe);
});

/* ───────── старт ───────── */
setLang(S.lang);
draw();
window.__wd = { S, NOW, NEW, GROUPS };
}
