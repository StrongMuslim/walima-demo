<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Walima — дизайны приглашений</title>
<meta name="theme-color" content="#f7f4ee">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f7f4ee;--ink:#25211c;--mu:#7a7163;--ln:#e6dfd2;--ac:#b4475a;--sf:#fff;--ease:cubic-bezier(.22,.8,.28,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);overflow-x:hidden}
html.lock,html.lock body{overflow:hidden}
body{font:400 14px/1.4 Onest,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
svg{display:block}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.hd{padding:max(18px,env(safe-area-inset-top)) 0 12px}
.hd h1{font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.hd p{color:var(--mu);margin-top:4px;font-size:13.5px}
/* вкладки */
.tabs{position:sticky;top:0;z-index:20;background:rgba(247,244,238,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln);padding:10px 0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#ece6da;border-radius:14px;padding:4px}
.seg button{min-height:44px;border-radius:11px;font-weight:600;font-size:15px;color:var(--mu);transition:background .2s,color .2s,box-shadow .2s}
.seg button[aria-selected=true]{background:var(--sf);color:var(--ink);box-shadow:0 1px 3px rgba(60,40,20,.14)}
.lang{display:flex;align-items:center;gap:8px;padding:14px 0 4px;flex-wrap:wrap}
.lang>span{font-size:12.5px;color:var(--mu);width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--ln);background:var(--sf);font-weight:500;transition:background .2s,color .2s,border-color .2s}
.chips button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
/* сетка */
.gh{display:flex;align-items:baseline;gap:8px;font-size:17px;font-weight:700;margin:26px 0 12px}
.gh span{font-size:13px;font-weight:500;color:var(--mu)}
.g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px}
.first{margin-top:16px}
@media(min-width:720px){.g{grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 20px}}
@media(min-width:1000px){.g{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cd{position:relative;cursor:pointer;outline:none;min-width:0}
.cd:focus-visible .ph{box-shadow:0 0 0 3px var(--ac)}
.ph{position:relative;aspect-ratio:390/800;border-radius:20px;overflow:hidden;box-shadow:0 0 0 3px #2b2723,0 10px 22px -8px rgba(50,35,20,.35);transition:transform .25s var(--ease);margin:3px;background-clip:padding-box;isolation:isolate}
.cd:active .ph{transform:scale(.975)}
.ph iframe{position:absolute;left:0;top:0;width:390px;height:800px;border:0;transform:scale(var(--s,.4));transform-origin:0 0;pointer-events:none;opacity:0;transition:opacity .35s;background:transparent}
.ph.rd iframe{opacity:1}
.hr{position:absolute;right:0;top:0;width:48px;height:48px;z-index:3;display:grid;place-items:center}
.hr i{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(0,0,0,.2);display:grid;place-items:center;transition:transform .2s var(--ease)}
.hr svg{width:19px;height:19px;fill:none;stroke:#6a5f52;stroke-width:2;transition:fill .15s,stroke .15s}
.hr[aria-pressed=true] svg{fill:var(--ac);stroke:var(--ac)}
.hr[aria-pressed=true] i{animation:pop .35s var(--ease)}
@keyframes pop{40%{transform:scale(1.22)}}
.cp{padding:9px 4px 0}
.cp b{display:block;font-size:14.5px;font-weight:600;line-height:1.25}
.cp small{display:block;color:var(--mu);font-size:12.5px;line-height:1.35;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cp code{display:block;font:500 10.5px ui-monospace,Menlo,monospace;color:#a89f90;margin-top:3px}
.empty{padding:60px 8px;text-align:center;color:var(--mu);font-size:15px}
main{padding-bottom:120px}
/* плавающая кнопка */
#fab{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));z-index:30;min-height:52px;padding:0 22px 0 18px;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;gap:9px;box-shadow:0 8px 24px -6px rgba(30,20,10,.5);transform:translate(-50%,90px);opacity:0;pointer-events:none;transition:transform .35s var(--ease),opacity .25s}
#fab.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#fab svg{width:20px;height:20px;fill:#f08fa0;stroke:#f08fa0;stroke-width:2}
/* лист выбранных */
#bd{position:fixed;inset:0;z-index:60;background:rgba(30,22,14,.45);opacity:0;pointer-events:none;transition:opacity .3s}
#bd.on{opacity:1;pointer-events:auto}
#sh{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:560px;margin:0 auto;max-height:82dvh;background:var(--bg);border-radius:24px 24px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .38s var(--ease);padding-bottom:env(safe-area-inset-bottom);visibility:hidden}
#sh.on{transform:none;visibility:visible}
.grab{width:40px;height:4px;border-radius:2px;background:#d6cdbd;margin:9px auto 0;flex:none}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 20px;flex:none}
.sh-h h2{font-size:18px;font-weight:700}
.x{width:48px;height:48px;display:grid;place-items:center;border-radius:50%}
.x svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
#sl{list-style:none;overflow-y:auto;overscroll-behavior:contain;padding:0 12px;flex:1 1 auto;min-height:0}
#sl li{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--ln)}
#sl li:last-child{border-bottom:0}
#sl .it{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;min-height:56px;padding:6px 8px}
#sl .sw{flex:none;width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 5px var(--a),0 0 0 1px rgba(0,0,0,.12)}
#sl b{display:block;font-weight:600;font-size:14.5px}
#sl em{display:block;font-style:normal;font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sl .rm{flex:none;color:var(--mu)}
.sh-f{display:flex;gap:8px;padding:12px 16px 16px;flex:none;border-top:1px solid var(--ln)}
.pri{flex:1;min-height:52px;border-radius:14px;background:var(--ink);color:#fff;font-weight:600;font-size:15.5px}
.gh2{min-height:52px;padding:0 16px;border-radius:14px;border:1px solid var(--ln);background:var(--sf);color:var(--mu);font-weight:500}
#ta{display:none;margin:0 16px 10px;width:calc(100% - 32px);height:84px;border:1px solid var(--ln);border-radius:12px;padding:10px;font:13px/1.4 Onest,sans-serif;background:#fff;color:var(--ink);resize:none}
#toast{position:fixed;left:50%;bottom:max(84px,calc(env(safe-area-inset-bottom) + 76px));z-index:90;transform:translate(-50%,12px);opacity:0;background:#25211c;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;max-width:calc(100vw - 32px);text-align:center;pointer-events:none;transition:opacity .25s,transform .25s var(--ease)}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* полноэкранный просмотр */
#fs{position:fixed;inset:0;z-index:50;background:#e9e3d7;display:flex;flex-direction:column;opacity:0;transform:translateY(14px) scale(.99);transition:opacity .28s,transform .34s var(--ease);visibility:hidden}
#fs.on{opacity:1;transform:none;visibility:visible}
.fb{flex:none;height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 4px 0;display:flex;align-items:center;background:var(--bg);border-bottom:1px solid var(--ln);z-index:3}
.ft{flex:1;min-width:0;text-align:center;line-height:1.2}
.ft b{display:block;font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft small{font-size:12.5px;color:var(--mu);font-variant-numeric:tabular-nums}
.lg{min-width:48px;height:48px;padding:0 6px;font-weight:600;font-size:13px;border-radius:12px}
#fh{width:48px;height:48px;display:grid;place-items:center}
#fh svg{width:24px;height:24px;fill:none;stroke:var(--ink);stroke-width:2;transition:fill .15s,stroke .15s}
#fh[aria-pressed=true] svg{fill:var(--ac);stroke:var(--ac);animation:pop .35s var(--ease)}
.stage{position:relative;flex:1;min-height:0;overflow:hidden}
.pn{position:absolute;inset:0;transition:transform .34s var(--ease);will-change:transform;background:var(--pb,#e9e3d7)}
.pn iframe{display:block;width:100%;height:100%;max-width:480px;margin:0 auto;border:0;background:var(--pb,#fff);box-shadow:0 0 40px rgba(60,40,20,.12)}
.ar{position:absolute;top:50%;z-index:4;width:48px;height:48px;margin-top:-24px;border-radius:50%;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(0,0,0,.2);display:grid;place-items:center;transition:opacity .2s,transform .2s}
.ar:active{transform:scale(.92)}
.ar svg{width:22px;height:22px;stroke:#25211c;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ar.l{left:max(6px,calc(50% - 296px))}.ar.r{right:max(6px,calc(50% - 296px))}
.ar[hidden]{display:none}
@media(max-width:480px){.ar{opacity:.78;width:44px;height:44px;margin-top:-22px}}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style></head><body>
<div class="wrap">
  <header class="hd"><h1>Дизайны приглашений</h1><p>Нажмите на любую карточку — приглашение откроется целиком. Сердечко — «Нравится».</p></header>
</div>
<div class="tabs"><div class="wrap"><div class="seg" role="tablist" id="tabs">
  <button role="tab" data-t="now" id="t-now"></button><button role="tab" data-t="new" id="t-new"></button></div></div></div>
<div class="wrap">
  <div class="lang"><span>Язык приглашений</span><div class="chips" id="langs">
    <button data-l="uz">Oʻzbekcha</button><button data-l="uzc">Ўзбекча</button><button data-l="ru">Русский</button></div></div>
  <main id="grid"></main>
</div>

<button id="fab" type="button"><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.2-9.4C1.7 7.700 3.700 4.500 7 4.500c2 0 3.700 1.100 5 3 1.300-1.900 3-3 5-3 3.300 0 5.300 3.200 4.200 6.600-1.700 4.800-9.200 9.400-9.200 9.400Z"/></svg><span id="fabn"></span></button>

<div id="fs" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="fb">
    <button class="x" id="fx" type="button" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    <div class="ft"><b id="fn"></b><small id="fc"></small></div>
    <button class="lg" id="fl" type="button" aria-label="Сменить язык приглашения"></button>
    <button id="fh" type="button" aria-label="Нравится" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.2-9.4C1.700 7.700 3.700 4.500 7 4.500c2 0 3.700 1.100 5 3 1.300-1.900 3-3 5-3 3.300 0 5.300 3.200 4.200 6.600-1.700 4.800-9.200 9.400-9.200 9.400Z"/></svg></button>
  </div>
  <div class="stage" id="stage">
    <div class="pn"></div><div class="pn"></div><div class="pn"></div>
    <button class="ar l" id="al" type="button" aria-label="Предыдущий дизайн"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="ar r" id="ar" type="button" aria-label="Следующий дизайн"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</div>

<div id="bd"></div>
<div id="sh" role="dialog" aria-modal="true" aria-label="Выбранные дизайны">
  <div class="grab"></div>
  <div class="sh-h"><h2 id="shn"></h2><button class="x" id="shx" type="button" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div>
  <ul id="sl"></ul>
  <textarea id="ta" readonly></textarea>
  <div class="sh-f"><button class="pri" id="cp" type="button">Скопировать список</button><button class="gh2" id="cl" type="button">Очистить</button></div>
</div>
<div id="toast" role="status"></div>

<script type="application/json" id="src">[{"key":"gentle","label":"Нежные","code":"// Нежная коллекция Walima: 10 дизайнов с ручной рисованной флорой.\n// Приём везде один: тонкая «чернильная» линия + акварельная заливка, чуть сдвинутая от контура\n// (как в ботанической иллюстрации), стебли рисуются (stroke-dashoffset), цветы и листья раскрываются\n// по мере того, как «кисть» проходит стебель. Бумага — шум feTurbulence в узоре фона.\n// Никаких живых существ и шестиконечных звёзд. Файл самодостаточный (без import) — его встраивает просмотрщик.\nfunction register({ THEMES, EXTRA, SINGLE, THEME_DESC, star8, svgUri }) {\n  /* ───────── числа и кривые ───────── */\n  const f = (n) => +(+n).toFixed(1);\n  const rad = (a) => (a * Math.PI) / 180;\n  const deg = (a) => (a * 180) / Math.PI;\n  // гладкая кривая через точки (Катмулл-Ром → кубические Безье)\n  const crPath = (pts) => {\n    let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;\n    for (let i = 0; i \u003c pts.length - 1; i++) {\n      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;\n      d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`;\n    }\n    return d;\n  };\n  // кривая Катмулла-Рома как функция u∈[0,1] — по ней ставим листья и цветы\n  const spline = (P) => (u) => {\n    const n = P.length - 1, x = Math.min(n - 1e-6, Math.max(0, u * n)), i = Math.floor(x), t = x - i;\n    const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || p2;\n    return [0, 1].map((k) => 0.5 * (2 * p1[k] + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t * t + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t * t * t));\n  };\n  const curve = (fn, n = 18) => Array.from({ length: n + 1 }, (_, i) => fn(i / n));\n  // точка на кривой и угол касательной (в градусах)\n  const at = (fn, t) => { const p = fn(t), a = fn(Math.max(0, t - 0.01)), b = fn(Math.min(1, t + 0.01)); return [p[0], p[1], deg(Math.atan2(b[1] - a[1], b[0] - a[0]))]; };\n  const sd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }; // детерминированный «случай»\n\n  /* ───────── общие помощники текста ───────── */\n  const esc = (s) => String(s ?? '').replace(/[&\u003c>\"']/g, (c) => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\n  const BRIDE = new Set(['kyz', 'qizoshi']);\n  const KG = /[үөңҮӨҢўқғҳЎҚҒҲʻ]/;\n  // строки имён как в движке: пара / один / инициалы\n  function nameLines(d) {\n    const g = (d.groom || '').trim(), b = (d.bride || '').trim();\n    if (d.nameMode === 'initials') return [[g[0] || '', 'nd'], ['&', 'amp'], [b[0] || '', 'nd']];\n    if (d.nameMode === 'groom') return [[g, 'nd']];\n    if (BRIDE.has(d.event)) return [[b || g, 'nd']];\n    return [[g, 'nd'], ['&', 'amp'], [b, 'nd']];\n  }\n  // имена «пишутся» (класс nm — движок подгоняет длинные имена и проигрывает «письмо»), вокруг — свой рисунок\n  // box: [ширина, высота] холста; ys: строки (3 и 1); art: рисунок под и над текстом\n  function namesWith(d, t, { box = [340, 220], ys3 = [76, 128, 192], y1 = 118, under = '', over = '', cls = '' } = {}) {\n    const L = nameLines(d), g = (d.groom || '') + (d.bride || '');\n    const k = t.f.script === 'Great Vibes' && KG.test(g) ? ' kg' : '';\n    const ys = L.length === 1 ? [y1] : ys3;\n    return `\u003csvg class=\"nm ${cls}${k}\" viewBox=\"0 0 ${box[0]} ${box[1]}\" role=\"img\" aria-label=\"${esc(L.map((l) => l[0]).join(' '))}\">${under}\n      ${L.map(([txt, c], i) => `\u003ctext x=\"${box[0] / 2}\" y=\"${ys[i]}\" class=\"${c}\" text-anchor=\"middle\">${esc(txt)}\u003c/text>`).join('')}${over}\u003c/svg>`;\n  }\n\n  /* ───────── бумага и акварель ───────── */\n  // шум бумаги для узора фона: тёплое зерно, почти незаметное\n  const paper = (rgb = '90,70,50', a = 0.05, freq = 0.85) => {\n    const [r, g, b] = rgb.split(',').map((x) => (+x / 255).toFixed(3));\n    return `\u003cfilter id='pn' x='0' y='0' width='100%' height='100%'>\u003cfeTurbulence type='fractalNoise' baseFrequency='${freq}' numOctaves='2' stitchTiles='stitch' seed='7'/>\u003cfeColorMatrix values='0 0 0 0 ${r} 0 0 0 0 ${g} 0 0 0 0 ${b} ${a * 6} 0 0 0 ${-a * 2}'/>\u003c/filter>\u003crect width='100%' height='100%' filter='url(#pn)'/>`;\n  };\n  // фильтр «акварельный край»: размытие + рваный край\n  const wcFilter = (id, scale = 22, blur = 7, seed = 3) => `\u003cfilter id=\"${id}\" x=\"-30%\" y=\"-30%\" width=\"160%\" height=\"160%\">\u003cfeGaussianBlur stdDeviation=\"${blur}\"/>\u003cfeTurbulence type=\"fractalNoise\" baseFrequency=\".022\" numOctaves=\"2\" seed=\"${seed}\" result=\"n\"/>\u003cfeDisplacementMap in2=\"n\" in=\"SourceGraphic\" scale=\"${scale}\" xChannelSelector=\"R\" yChannelSelector=\"G\"/>\u003c/filter>`;\n  // акварельное пятно: эллипс с радиальным градиентом, пропущенный через фильтр\n  // два слоя: мягкое размытое пятно и чуть более тёмная «кромка», где пигмент собирается при высыхании\n  const wash = (fid, x, y, rx, ry, color, op, d = 0, rot = 0) =>\n    `\u003cg class=\"g-w\" style=\"--d:${d}s\" transform=\"rotate(${rot} ${f(x)} ${f(y)})\">\u003cellipse cx=\"${f(x)}\" cy=\"${f(y)}\" rx=\"${f(rx)}\" ry=\"${f(ry)}\" fill=\"${color}\" fill-opacity=\"${op}\" filter=\"url(#${fid})\"/>\n      \u003cellipse cx=\"${f(x + rx * 0.06)}\" cy=\"${f(y - ry * 0.04)}\" rx=\"${f(rx * 0.86)}\" ry=\"${f(ry * 0.84)}\" fill=\"none\" stroke=\"${color}\" stroke-width=\"2\" stroke-opacity=\"${f(op * 0.55)}\" filter=\"url(#${fid}e)\"/>\u003c/g>`;\n  const wcDefs = (id, scale = 20, blur = 9, seed = 3) => wcFilter(id, scale, blur, seed) + `\u003cfilter id=\"${id}e\" x=\"-30%\" y=\"-30%\" width=\"160%\" height=\"160%\">\u003cfeGaussianBlur stdDeviation=\"1.6\"/>\u003cfeTurbulence type=\"fractalNoise\" baseFrequency=\".03\" numOctaves=\"2\" seed=\"${seed + 2}\" result=\"n\"/>\u003cfeDisplacementMap in2=\"n\" in=\"SourceGraphic\" scale=\"${scale * 1.3}\" xChannelSelector=\"R\" yChannelSelector=\"G\"/>\u003c/filter>`;\n\n  /* ───────── ботанический набор ───────── */\n  // стебель: рисуется кистью\n  const stem = (d, c, w = 1.3, delay = 0.2, dur = 2.6) => `\u003cpath d=\"${d}\" fill=\"none\" stroke=\"${c}\" stroke-width=\"${w}\" stroke-linecap=\"round\" class=\"dr g-st\" pathLength=\"1\" style=\"--d:${delay}s;--t:${dur}s\"/>`;\n  // ветка кистью: залитый силуэт, толстый у основания и тонкий к концу, с лёгкими узелками;\n  // проявляется маской — толстой линией по той же кривой, которая «рисуется»\n  let bid = 0;\n  function brush(fn, w0, w1, color, delay = 0.2, dur = 2.6, { n = 40, knots = 0, pre = 'b' } = {}) {\n    const id = `${pre}${++bid}`, L = [], Rr = [];\n    for (let i = 0; i \u003c= n; i++) {\n      const u = i / n, [x, y, a] = at(fn, u);\n      let w = (w0 + (w1 - w0) * Math.pow(u, 0.8)) / 2;\n      if (knots) w *= 1 + 0.35 * Math.max(0, Math.sin(u * Math.PI * knots * 2)) ** 8; // узелки на ветке\n      w *= 1 + 0.08 * Math.sin(u * 37 + w0);\n      const nx = Math.cos(rad(a + 90)), ny = Math.sin(rad(a + 90));\n      L.push([x + nx * w, y + ny * w]); Rr.unshift([x - nx * w, y - ny * w]);\n    }\n    const shape = crPath(L) + 'L' + crPath(Rr).slice(1) + 'Z';\n    const mid = crPath(curve(fn, n));\n    return `\u003cmask id=\"${id}\" maskUnits=\"userSpaceOnUse\" x=\"-400\" y=\"-400\" width=\"1200\" height=\"1300\">\u003cpath d=\"${mid}\" fill=\"none\" stroke=\"#fff\" stroke-width=\"${f(w0 * 2 + 6)}\" stroke-linecap=\"round\" class=\"dr g-st\" pathLength=\"1\" style=\"--d:${delay}s;--t:${dur}s\"/>\u003c/mask>\n      \u003cpath d=\"${shape}\" fill=\"${color}\" mask=\"url(#${id})\"/>`;\n  }\n  // лист: из точки (x,y) в направлении ang; шире/уже — W; заливка сдвинута от контура\n  function leaf(x, y, ang, L, W, delay, c, { vein = true, op = 0.62, tipCurl = 0 } = {}) {\n    const s = `M0 0C${f(L * 0.25)} ${f(-W)} ${f(L * 0.7)} ${f(-W * 0.9 + tipCurl)} ${f(L)} ${f(tipCurl)}C${f(L * 0.72)} ${f(W * 0.75 + tipCurl)} ${f(L * 0.3)} ${f(W * 0.95)} 0 0Z`;\n    return `\u003cg transform=\"translate(${f(x)} ${f(y)}) rotate(${f(ang)})\">\u003cg class=\"g-a g-lf\" style=\"--d:${f(delay)}s\">\n      \u003cpath d=\"${s}\" fill=\"${c.leaf}\" fill-opacity=\"${op}\" transform=\"translate(1.3 .9)\"/>\u003cpath d=\"${s}\" fill=\"none\" stroke=\"${c.line}\" stroke-width=\".65\" stroke-linejoin=\"round\"/>\n      ${vein ? `\u003cpath d=\"M1 0Q${f(L * 0.5)} ${f(-W * 0.15 + tipCurl * 0.4)} ${f(L * 0.88)} ${f(tipCurl * 0.8)}\" fill=\"none\" stroke=\"${c.line}\" stroke-width=\".45\" opacity=\".7\"/>` : ''}\u003c/g>\u003c/g>`;\n  }\n  // пятилепестковый цветок (миндаль, урюк, айва): лепесток с выемкой, у основания темнее\n  function flower5(x, y, r, rot, delay, c, { notch = true, squash = 1, petals = 5, cup = 0.55, gid } = {}) {\n    const p = notch\n      ? `M0 0C${f(-r * cup)} ${f(-r * 0.2)} ${f(-r * 0.72)} ${f(-r * 0.95)} ${f(-r * 0.16)} ${f(-r)}Q0 ${f(-r * 0.86)} ${f(r * 0.16)} ${f(-r)}C${f(r * 0.72)} ${f(-r * 0.95)} ${f(r * cup)} ${f(-r * 0.2)} 0 0Z`\n      : `M0 0C${f(-r * cup)} ${f(-r * 0.2)} ${f(-r * 0.7)} ${f(-r * 1.02)} 0 ${f(-r * 1.02)}C${f(r * 0.7)} ${f(-r * 1.02)} ${f(r * cup)} ${f(-r * 0.2)} 0 0Z`;\n    const ks = Array.from({ length: petals }, (_, i) => (360 / petals) * i);\n    const stam = Array.from({ length: 9 }, (_, i) => { const a = rad(i * 40 + 13), l = r * (0.32 + 0.12 * sd(i + x)); return `\u003cpath d=\"M0 0L${f(Math.cos(a) * l)} ${f(Math.sin(a) * l)}\"/>\u003ccircle cx=\"${f(Math.cos(a) * l)}\" cy=\"${f(Math.sin(a) * l)}\" r=\"${f(r * 0.045 + 0.35)}\"/>`; }).join('');\n    return `\u003cg transform=\"translate(${f(x)} ${f(y)}) rotate(${f(rot)}) scale(1 ${squash})\">\u003cg class=\"g-a g-fl\" style=\"--d:${f(delay)}s\">\n      ${ks.map((k) => `\u003cpath d=\"${p}\" transform=\"rotate(${k}) translate(1 .8)\" fill=\"url(#${gid})\"/>`).join('')}\n      ${ks.map((k) => `\u003cpath d=\"${p}\" transform=\"rotate(${k})\" fill=\"none\" stroke=\"${c.line}\" stroke-width=\".6\" stroke-linejoin=\"round\"/>\u003cpath d=\"M0 ${f(-r * 0.2)}Q${f(-r * 0.12)} ${f(-r * 0.5)} ${f(-r * 0.22)} ${f(-r * 0.74)}M0 ${f(-r * 0.2)}Q${f(r * 0.1)} ${f(-r * 0.52)} ${f(r * 0.2)} ${f(-r * 0.7)}\" transform=\"rotate(${k})\" fill=\"none\" stroke=\"${c.line}\" stroke-width=\".35\" opacity=\".45\"/>`).join('')}\n      \u003cg stroke=\"${c.stamen}\" stroke-width=\".45\" fill=\"${c.stamen}\">${stam}\u003c/g>\u003ccircle r=\"${f(r * 0.14)}\" fill=\"${c.heart}\"/>\u003c/g>\u003c/g>`;\n  }\n  // бутон: капля из лепестков с чашечкой\n  function bud(x, y, ang, s, delay, c, gid) {\n    return `\u003cg transform=\"translate(${f(x)} ${f(y)}) rotate(${f(ang)})\">\u003cg class=\"g-a g-lf\" style=\"--d:${f(delay)}s\">\n      \u003cpath d=\"M0 0C${f(s * 0.3)} ${f(-s * 0.55)} ${f(s * 0.95)} ${f(-s * 0.5)} ${f(s * 1.15)} 0C${f(s * 0.95)} ${f(s * 0.5)} ${f(s * 0.3)} ${f(s * 0.55)} 0 0Z\" fill=\"url(#${gid})\" stroke=\"${c.line}\" stroke-width=\".6\"/>\n      \u003cpath d=\"M0 0C${f(s * 0.2)} ${f(-s * 0.35)} ${f(s * 0.4)} ${f(-s * 0.3)} ${f(s * 0.5)} ${f(-s * 0.12)}M0 0C${f(s * 0.2)} ${f(s * 0.35)} ${f(s * 0.4)} ${f(s * 0.3)} ${f(s * 0.5)} ${f(s * 0.12)}\" fill=\"none\" stroke=\"${c.calyx || c.line}\" stroke-width=\".9\" stroke-linecap=\"round\"/>\u003c/g>\u003c/g>`;\n  }\n  // градиент лепестка: у основания насыщенный, к краю почти белый (единицы — рамка лепестка)\n  const petalGrad = (id, inner, outer, cy = '100%') => `\u003cradialGradient id=\"${id}\" cx=\"50%\" cy=\"${cy}\" r=\"95%\">\u003cstop offset=\"0\" stop-color=\"${inner}\"/>\u003cstop offset=\".55\" stop-color=\"${outer}\" stop-opacity=\".9\"/>\u003cstop offset=\"1\" stop-color=\"${outer}\" stop-opacity=\".55\"/>\u003c/radialGradient>`;\n\n  /* ───────── общий стиль всех нежных обложек ───────── */\n  const CSS_BASE = `\n.g-a{transform-box:fill-box;transform-origin:center}\n.g-lf{transform-origin:0 50%}\n.js .cv .g-a,.js .cv .g-w,.js .cv .g-fade{opacity:0}\n.play .g-a{animation:gPop .95s cubic-bezier(.3,1.35,.5,1) forwards;animation-delay:var(--d,1s)}\n.play .g-lf{animation-name:gLeaf;animation-timing-function:cubic-bezier(.25,1.2,.5,1)}\n.play .g-w{animation:gFade 2.6s ease forwards;animation-delay:var(--d,0s)}\n.play .g-fade{animation:gFade 1.2s ease forwards;animation-delay:var(--d,1.5s)}\n.play .g-st.dr{animation:draw var(--t,2.6s) cubic-bezier(.45,0,.25,1) forwards;animation-delay:var(--d,.2s)}\n@keyframes gPop{from{opacity:0;transform:scale(.15) rotate(-25deg)}to{opacity:1;transform:none}}\n@keyframes gLeaf{from{opacity:0;transform:scale(.1)}to{opacity:1;transform:none}}\n@keyframes gFade{to{opacity:1}}\n.cf.g-cf{pointer-events:none}\n.nm .g-art{overflow:visible}\n`;\n  const covCss = (name, css) => { EXTRA.css[name] = CSS_BASE + css; };\n\n  /* ════════════════ 1. Bodom gullari — венок миндаля ════════════════ */\n  // Венок вокруг имён: две голые ветки миндаля (цветы раньше листьев), левая — длиннее, правая обрывается на 2/3.\n  EXTRA.names['g-wreath'] = (d, t) => {\n    const c = t.g, id = t.id;\n    const cx = 170, cy = 182, R = 150;\n    // левая ветка: от низа против часовой до верха; правая — короче\n    // ветки миндаля угловатые: к окружности добавлены мелкие изломы\n    const left = (u) => { const a = rad(98 + u * 172); const k = 1 + 0.025 * Math.sin(u * 23) + 0.02 * Math.sin(u * 7); return [cx + Math.cos(a) * R * k, cy + Math.sin(a) * R * 1.03 * k]; };\n    const right = (u) => { const a = rad(82 - u * 122); const k = 1 - 0.022 * Math.sin(u * 19) + 0.015 * Math.sin(u * 5); return [cx + Math.cos(a) * R * k, cy + Math.sin(a) * R * 1.03 * k]; };\n    let art = `\u003cdefs>${petalGrad(id + '-p', c.pet2, c.pet)}${wcDefs(id + '-wc', 18, 11, 4)}\u003c/defs>`;\n    art += wash(id + '-wc', 62, 120, 62, 44, c.wash1, 0.5, 0.1, -30) + wash(id + '-wc', 282, 262, 58, 40, c.wash2, 0.5, 0.4, 20) + wash(id + '-wc', 150, 336, 50, 15, c.wash1, 0.4, 0.6, -4);\n    const D = (u, d0) => d0 + u * 2.5; // когда кисть доходит до точки u\n    const branch = (fn, d0, side, cl) => {\n y: 'Alegreya', script: 'Great Vibes', body: 'Onest' },\n      g: { pet: '#f0937a', pet2: '#f9c8a8', petTip: '#e86f5d', line: '#8e4636', leaf: '#97b07c', stem: '#6f8c5c', wash1: '#f6dcc4', wash2: '#e1e9cc' } },\n    { id: 'g-nastarin', cat: 'gentle', mark: 'lilac', name: { uz: 'Nastarin', ru: 'Сирень' }, pattern: 'g-florets', cover: 'g-crescent', card: 'plain',\n      fx: 'radial-gradient(70% 50% at 0% 50%,#ece4f1 0%,transparent 70%),radial-gradient(60% 30% at 60% 0%,#efe8f3 0%,transparent 70%)',\n      c: { bg: '#f8f5f8', bg2: '#ece5ef', surface: '#fdfbfd', ink: '#3a3142', muted: '#6f6479', accent: '#7a5690', accent2: '#9fae8e', line: 'rgba(122,86,144,.26)' },\n      f: { display: 'Cormorant Garamond', script: 'Bad Script', body: 'Montserrat' },\n      g: { pet: '#c3a6d8', pet2: '#9d77bd', pet3: '#e2d3ee', heart: '#f4ecd8', line: '#6c4f84', leaf: '#9fb48c', lline: '#5f7352', stem: '#6c5a52', wash1: '#e6dbef', wash2: '#e3ead9' } },\n    { id: 'g-zaytun', cat: 'gentle', mark: 'olive', name: { uz: 'Zaytun novdasi', ru: 'Оливковая ветвь' }, pattern: 'g-olivegrain', cover: 'g-oliveframe', card: 'plain',\n      fx: 'radial-gradient(80% 50% at 50% 50%,#f8f8f2 0%,transparent 80%)',\n      c: { bg: '#f1f2ea', bg2: '#e3e6d8', surface: '#fafbf6', ink: '#2e3428', muted: '#5f665a', accent: '#56683f', accent2: '#a3ae8c', line: 'rgba(86,104,63,.3)' },\n      f: { display: 'Vollkorn', script: 'Bad Script', body: 'Inter' },\n      g: { leaf: '#9aab84', leaf2: '#c3cdb2', line: '#55603f', stem: '#6c6650', fruit: '#5d5a3c', wash1: '#dde4cf', wash2: '#e9e2cf' } },\n    { id: 'g-tok', cat: 'gentle', mark: 'grape', name: { uz: 'Tok', ru: 'Виноградная лоза' }, pattern: 'g-vinedots', cover: 'g-vine', card: 'plain',\n      fx: 'linear-gradient(180deg,#f3efe9 0%,#f7f4ef 50%,#f2ede6 100%)',\n      c: { bg: '#f6f3ee', bg2: '#ebe4dc', surface: '#fcfaf7', ink: '#3a2c30', muted: '#6e5f63', accent: '#7b3550', accent2: '#8e9a6a', line: 'rgba(123,53,80,.26)' },\n      f: { display: 'Alegreya', script: 'Marck Script', body: 'Commissioner' },\n      g: { leaf: '#a5b17f', line: '#5d5038', stem: '#7a5c45', grape: '#5a2a45', grape2: '#a46a88', wash1: '#e9e0d3', wash2: '#e4e8d4', wash3: '#e8cfdc' } },\n  ];\n  SINGLE.add('Marck Script');\n  const DESC = {\n    'g-bodom': ['Bodom gullaridan gulchambar, nafis va yorugʻ', 'Венок из цветущего миндаля, светло и нежно'],\n    'g-paxta': ['Paxta novdasi va zigʻir qogʻoz, tabiiy iliqlik', 'Ветка хлопка и льняная бумага, тёплая простота'],\n    'g-yasmin': ['Yasmin gulchambari, toʻq shalfey fonida', 'Гирлянда жасмина на тёмном шалфее'],\n    'g-atirgul': ['Atirgullar guldastasi, chang-pushti qogʻoz', 'Букетик роз на пыльно-розовой бумаге'],\n    'g-anor': ['Anor guli shoxchasi, iliq marjon rang', 'Ветка гранатового цвета, тёплый коралл'],\n    'g-behi': ['Behi gullari bilan oʻralgan ravoq', 'Арка, оплетённая цветущей айвой'],\n    'g-lola': ['Bahorgi lolalar guldastasi, quyoshli', 'Весенние тюльпаны, солнечно'],\n    'g-nastarin': ['Nastarin shingillari yarim oy boʻylab', 'Гроздья сирени полумесяцем'],\n    'g-zaytun': ['Zaytun novdalaridan hoshiya, sokin va toza', 'Рамка из оливковых веток, тихо и чисто'],\n    'g-tok': ['Tok novdasi, gajaklari va boshlari', 'Виноградная лоза с усиками и гроздьями'],\n  };\n  for (const t of T) {\n    // заголовки разделов: вместо звёздочки — веточка той же флоры, что на обложке\n    t.css = `body.t-${t.id} .h::before{width:54px;height:30px;margin-bottom:10px;clip-path:none;background:${markSvg(t)} center/contain no-repeat;opacity:1}` + (t.css || '');\n    THEMES.push(t); THEME_DESC[t.id] = DESC[t.id];\n  }\n  return T.map((t) => t.id);\n}\n\nreturn register(ctx);"},{"key":"uzbek","label":"Узбекские","code":"// Узбекская коллекция Walima: 10 дизайнов «с узбекским духом, но не по-колхозному».\n// Правило коллекции: один мотив на дизайн, исполненный точно и тонко; орнамент — рамка, кайма или медальон,\n// а не обои; приглушённая благородная палитра, много воздуха. Никаких живых существ, только восьмиконечные звёзды.\n// Полупрозрачность задаём через fill-opacity / stroke-opacity, а не opacity: при «уменьшить движение»\n// движок ставит всем элементам обложки opacity:1, и рисунок не должен от этого ломаться.\nfunction register({ THEMES, EXTRA, SINGLE, THEME_DESC, star8, svgUri }) {\n  /* ───────── помощники ───────── */\n  const esc = (s) => String(s ?? '').replace(/ʻ/g, '‘').replace(/ʼ/g, '’').replace(/[&\u003c>\"']/g, (c) => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\n  const BRIDE = new Set(['kyz', 'qizoshi']);\n  const f2 = (n) => +n.toFixed(2);\n  // строки имён — как в движке (оба, только жених, инициалы, только невеста)\n  function nameLines(d) {\n    const g = (d.groom || '').trim(), b = (d.bride || '').trim();\n    if (d.nameMode === 'initials') return [[g[0] || '', 'nd'], ['&', 'amp'], [b[0] || '', 'nd']];\n    if (d.nameMode === 'groom') return [[g, 'nd']];\n    if (BRIDE.has(d.event)) return [[b || g, 'nd']];\n    return [[g, 'nd'], ['&', 'amp'], [b, 'nd']];\n  }\n  // имена тем же SVG, что и в движке: анимация «пишется от руки» и подгонка ширины работают как обычно\n  function namesSvg(d) {\n    const lines = nameLines(d);\n    const ys = lines.length === 1 ? [118] : [76, 128, 192];\n    return `\u003csvg class=\"nm\" viewBox=\"0 0 340 220\" role=\"img\" aria-label=\"${esc(lines.map((l) => l[0]).join(' '))}\">\n      ${lines.map(([txt, c], i) => `\u003ctext x=\"170\" y=\"${ys[i]}\" class=\"${c}\" text-anchor=\"middle\">${esc(txt)}\u003c/text>`).join('')}\u003c/svg>`;\n  }\n  // восьмиконечная звезда как clip-path в процентах (для маленьких значков)\n  const pct = (pts) => pts.split(' ').map((p) => p.split(',').map((v) => `${v}%`).join(' ')).join(',');\n  // значок над заголовками разделов: своя маленькая картинка вместо общей звёздочки\n  const headIcon = (id, svg, w = 22, h = 22) => `body.t-${id} .h::before{clip-path:none;background:${svgUri(svg)} center/contain no-repeat;width:${w}px;height:${h}px;opacity:1}`;\n  // стрельчатая арка: левый край L, правый R, пята ys, вершина ya, низ base\n  function arch(L, R, ys, ya, base) {\n    const C = (L + R) / 2, hw = (R - L) / 2, H = ys - ya;\n    return `M${L} ${base}V${ys}C${L} ${f2(ys - 0.445 * H)} ${f2(C - 0.5 * hw)} ${f2(ya + 0.287 * H)} ${C} ${ya}C${f2(C + 0.5 * hw)} ${f2(ya + 0.287 * H)} ${R} ${f2(ys - 0.445 * H)} ${R} ${ys}V${base}`;\n  }\n  // точки вдоль той же арки с равным шагом (для бусин и резных мотивов по кривой)\n  function archPts(L, R, ys, ya, base, step) {\n    const C = (L + R) / 2, hw = (R - L) / 2, H = ys - ya;\n    const cub = (p0, p1, p2, p3, t) => { const u = 1 - t; return u * u * u * p0 + 3 * u * u * t * p1 + 3 * u * t * t * p2 + t * t * t * p3; };\n    const raw = [];\n    for (let y = base; y > ys; y -= 2) raw.push([L, y]);\n    for (let i = 0; i \u003c= 80; i++) { const t = i / 80; raw.push([cub(L, L, C - 0.5 * hw, C, t), cub(ys, ys - 0.445 * H, ya + 0.287 * H, ya, t)]); }\n    for (let i = 1; i \u003c= 80; i++) { const t = i / 80; raw.push([cub(C, C + 0.5 * hw, R, R, t), cub(ya, ya + 0.287 * H, ys - 0.445 * H, ys, t)]); }\n    for (let y = ys + 2; y \u003c= base; y += 2) raw.push([R, y]);\n    const out = []; let acc = 0, next = step / 2;\n    for (let i = 1; i \u003c raw.length; i++) {\n      const [x0, y0] = raw[i - 1], [x1, y1] = raw[i], seg = Math.hypot(x1 - x0, y1 - y0);\n      while (acc + seg >= next) { const k = (next - acc) / seg; out.push([x0 + (x1 - x0) * k, y0 + (y1 - y0) * k, Math.atan2(y1 - y0, x1 - x0) * 180 / Math.PI]); next += step; }\n      acc += seg;\n    }\n    return out;\n  }\n  // полуширина арки на высоте y (для мукарнаса)\n  function archHalf(L, R, ys, ya, y) {\n    if (y >= ys) return (R - L) / 2;\n    const pts = archPts(L, R, ys, ya, ys, 1).filter((p) => p[0] \u003c= (L + R) / 2);\n    let best = pts[0]; for (const p of pts) if (Math.abs(p[1] - y) \u003c Math.abs(best[1] - y)) best = p;\n    return (L + R) / 2 - best[0];\n  }\n  // псевдослучайность с зерном — чтобы рисунок был одинаковым при каждом показе\n  const rnd = (seed) => () => ((seed = (seed * 16807) % 2147483647) / 2147483647);\n  const T = [];\n  const add = (t, uz, ru) => { T.push(t); THEMES.push(t); THEME_DESC[t.id] = [uz, ru]; };\n\n  /* ════════════ 1. Oq ganch — белый резной ганч, ниша-михраб ════════════ */\n  {\n    const id = 'u-ganch';\n    // рельеф: каждая линия трижды — блик (светлее, сдвиг влево-вверх), тень (темнее, вправо-вниз), сама линия\n    const relief = (inner, sw = 1) => `\u003cg class=\"gn-hi\" stroke-width=\"${sw}\">${inner}\u003c/g>\u003cg class=\"gn-sh\" stroke-width=\"${sw}\">${inner}\u003c/g>\u003cg class=\"gn-ln\" stroke-width=\"${sw * 0.7}\">${inner}\u003c/g>`;\n    EXTRA.patterns['u-plaster'] = (t) => svgUri(`\u003csvg xmlns='http://www.w3.org/2000/svg' width='220' height='220'>\u003cfilter id='n'>\u003cfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' seed='4'/>\u003cfeColorMatrix values='0 0 0 0 .45  0 0 0 0 .40  0 0 0 0 .33  0 0 0 -1.6 1.05'/>\u003c/filter>\u003crect width='100%' height='100%' filter='url(#n)' opacity='.16'/>\u003c/svg>`);\n    EXTRA.covers['u-ganch-mehrob'] = () => {\n      const O = [10, 310, 214, 12], M = [24, 296, 218, 34], I = [38, 282, 222, 56];\n      // бусины между внешней и средней линией\n      const bp = archPts(17, 303, 216, 23, 540, 7.2).map(([x, y]) => `\u003ccircle cx=\"${f2(x)}\" cy=\"${f2(y)}\" r=\"2.1\"/>`).join('');\n      // резные «листочки» по второй полосе, повёрнуты вдоль кривой\n      const lv = archPts(31, 289, 220, 45, 540, 15).map(([x, y, a], i) => `\u003cg transform=\"translate(${f2(x)} ${f2(y)}) rotate(${f2(a)})\">${i % 2 ? '\u003cpath d=\"M-5 0C-2 -4 2 -4 5 0C2 4 -2 4 -5 0Z\"/>' : '\u003ccircle r=\"2.4\"/>\u003cpath d=\"M-6.5 0H-4.2M4.2 0H6.5\"/>'}\u003c/g>`).join('');\n      // мукарнас: ряды стрельчатых ячеек, каждый следующий ряд сдвинут на полъячейки\n      let cells = '', shade = '';\n      const cw = 24, rh = 22, y0 = 58;\n      for (let r = 0; r \u003c ackground:linear-gradient(90deg,var(--ln),var(--ac));margin:4px 0 14px -10.5vw}\n@media (min-width:426px){.cv-u-xonatlas-lenta .cv-date::before{margin-left:-42px}}\n`;\n    add({ id, cat: 'uzbek', name: { uz: 'Xon atlas', ru: 'Хан-атлас' }, pattern: 'u-xonatlas-none', cover: 'u-xonatlas-lenta', card: 'plain',\n      fx: 'linear-gradient(100deg,#f6f1ea 0%,#fbf9f6 40%,#faf8f4 100%)',\n      c: { bg: '#faf8f4', bg2: '#f1ebe3', surface: '#ffffff', ink: '#2b2433', muted: '#625a69', accent: '#8a3452', accent2: '#2f6d6a', line: 'rgba(138,52,82,.22)' },\n      f: { display: 'Piazzolla', script: 'Piazzolla', body: 'Nunito Sans' },\n      css: `body.t-${id} .nm text{font-family:var(--fd);font-style:italic;font-weight:300;font-size:60px}body.t-${id} .nm .amp{font-size:30px}\nbody.t-${id} .lt-sign b{font-family:var(--fd);font-style:italic;font-weight:400;font-size:30px}\nbody.t-${id} .paper{border-left:6px solid transparent;border-image:linear-gradient(180deg,#8a3452 0 25%,#c99d55 25% 50%,#2f6d6a 50% 75%,#8a3452 75%) 1}\n${headIcon(id, `\u003csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 40'>\u003crect width='16' height='40' fill='#c99d55'/>\u003cpolygon points='8,0 16,10 8,20 0,10' fill='#8a3452'/>\u003cpolygon points='8,20 16,30 8,40 0,30' fill='#8a3452'/>\u003cpolygon points='8,5 12,10 8,15 4,10' fill='#2f6d6a'/>\u003cpolygon points='8,25 12,30 8,35 4,30' fill='#2f6d6a'/>\u003c/svg>`, 9, 24)}` },\n    'Margʻilon xon atlasidan lenta-xatchoʻp, ipak tugun', 'Лента-закладка из маргиланского хан-атласа с шёлковым узелком');\n  }\n\n  /* ════════════ 10. Non — тандырная лепёшка со штампом-чекичем как печать между именами и датой ════════════ */\n  {\n    const id = 'u-non';\n    EXTRA.patterns['u-non-none'] = () => 'none';\n    const nonSvg = () => {\n      const R = rnd(29);\n      let pricks = '', seeds = '';\n      const ring = (r, n, rr, off = 0) => { for (let i = 0; i \u003c n; i++) { const a = (i + off) / n * Math.PI * 2; pricks += `\u003ccircle cx=\"${f2(r * Math.cos(a))}\" cy=\"${f2(r * Math.sin(a))}\" r=\"${rr}\"/>`; } };\n      ring(64, 44, 1.05); ring(43, 30, 1.1, 0.5); ring(29, 20, 1.1);\n      let dash = '';\n      for (let i = 0; i \u003c 32; i++) { const a = i / 32 * Math.PI * 2; dash += `M${f2(50 * Math.cos(a))} ${f2(50 * Math.sin(a))}L${f2(57 * Math.cos(a))} ${f2(57 * Math.sin(a))}`; }\n      for (let k = 0; k \u003c 8; k++) { const a = k / 8 * Math.PI * 2 + Math.PI / 8; for (const r of [7, 13, 19]) pricks += `\u003ccircle cx=\"${f2(r * Math.cos(a))}\" cy=\"${f2(r * Math.sin(a))}\" r=\"1.15\"/>`; }\n      pricks += '\u003ccircle r=\"1.8\"/>';\n      for (let i = 0; i \u003c 46; i++) {\n        const a = R() * Math.PI * 2, r = 76 + R() * 15, rot = R() * 180;\n        seeds += `\u003cellipse cx=\"${f2(r * Math.cos(a))}\" cy=\"${f2(r * Math.sin(a))}\" rx=\".9\" ry=\"1.9\" transform=\"rotate(${f2(rot)} ${f2(r * Math.cos(a))} ${f2(r * Math.sin(a))})\" class=\"${i % 3 ? 'nn-se' : 'nn-ni'}\"/>`;\n      }\n      return `\u003csvg class=\"nn\" viewBox=\"-104 -104 208 212\" aria-hidden=\"true\">\u003cdefs>\n        \u003cradialGradient id=\"nn-c\" r=\"50%\">\u003cstop offset=\"0\" stop-color=\"#f3e0b8\"/>\u003cstop offset=\".7\" stop-color=\"#ecd29f\"/>\u003cstop offset=\".735\" stop-color=\"#cf9150\"/>\u003cstop offset=\".83\" stop-color=\"#c47e3c\"/>\u003cstop offset=\".95\" stop-color=\"#a1602a\"/>\u003cstop offset=\"1\" stop-color=\"#8b5022\"/>\u003c/radialGradient>\n        \u003clinearGradient id=\"nn-hl\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\u003cstop offset=\"0\" stop-color=\"#fff\" stop-opacity=\".35\"/>\u003cstop offset=\".5\" stop-color=\"#fff\" stop-opacity=\"0\"/>\u003cstop offset=\"1\" stop-color=\"#5a3010\" stop-opacity=\".22\"/>\u003c/linearGradient>\n        \u003cradialGradient id=\"nn-s\" r=\"50%\">\u003cstop offset=\".75\" stop-color=\"#6b3f1a\" stop-opacity=\".22\"/>\u003cstop offset=\"1\" stop-color=\"#6b3f1a\" stop-opacity=\"0\"/>\u003c/radialGradient>\u003c/defs>\n        \u003cellipse cx=\"3\" cy=\"9\" rx=\"104\" ry=\"100\" fill=\"url(#nn-s)\"/>\n        \u003ccircle r=\"96\" fill=\"url(#nn-c)\"/>\u003ccircle r=\"96\" fill=\"url(#nn-hl)\"/>\n        \u003ccircle r=\"71\" class=\"nn-lip\"/>\n        \u003cg class=\"nn-st\">\u003cpath d=\"${dash}\" class=\"nn-da\"/>${pricks}\u003c/g>${seeds}\u003c/svg>`;\n    };\n    EXTRA.covers['u-non'] = () => `\u003csvg class=\"cf nn-fr\" viewBox=\"0 0 320 520\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M40 10H280M40 510H280\" class=\"cf-ln thin dr\" pathLength=\"1\"/>\u003c/svg>`;\n    EXTRA.names['u-non'] = (d) => `${namesSvg(d)}\u003cdiv class=\"nn-wrap\">${nonSvg()}\u003c/div>`;\n    EXTRA.css['u-non'] = `\n.cv-u-non .cv-box{width:min(90vw,380px)}\n.cv-u-non .cv-in{padding:34px 22px 30px}\n.nn-wrap{width:min(42vw,168px);margin:4px auto 16px}\n.nn{display:block;width:100%;height:auto;overflow:visible}\n.nn .nn-lip{fill:none;stroke:#9b5c28;stroke-opacity:.35;stroke-width:2.2}\n.nn .nn-st{fill:#7d4a1f;fill-opacity:.72}.nn .nn-da{fill:none;stroke:#7d4a1f;stroke-opacity:.55;stroke-width:1.3;stroke-linecap:round}\n.nn .nn-se{fill:#f8ead0}.nn .nn-ni{fill:#2e2219;fill-opacity:.85}\n.nn-fr .cf-ln.thin{stroke:var(--ac)}\n.js .cv .nn-wrap{opacity:0}\n.play .nn-wrap{animation:nnIn 1s cubic-bezier(.3,1.4,.5,1) forwards 2.2s}\n@keyframes nnIn{from{opacity:0;transform:scale(.7) rotate(-20deg)}to{opacity:1;transform:none}}\n`;\n    add({ id, cat: 'uzbek', name: { uz: 'Non', ru: 'Лепёшка' }, pattern: 'u-non-none', cover: 'u-non', card: 'plain',\n      fx: 'radial-gradient(80% 50% at 50% 45%,#fbf5ea 0%,#f4ebdb 100%)',\n      c: { bg: '#f6eee1', bg2: '#ece0cb', surface: '#fcf8f0', ink: '#3b2a1b', muted: '#6c5642', accent: '#8a5024', accent2: '#c99a5b', line: 'rgba(138,80,36,.28)' },\n      f: { display: 'Vollkorn', script: 'Vollkorn', body: 'Vollkorn' },\n      css: `body.t-${id} .nm text{font-family:var(--fd);font-style:italic;font-weight:400;font-size:58px}body.t-${id} .nm .amp{font-size:30px}\nbody.t-${id} .lt-sign b{font-family:var(--fd);font-style:italic;font-size:30px}\nbody.t-${id} .stamp{fill:#a1602a}\n${headIcon(id, `\u003csvg xmlns='http://www.w3.org/2000/svg' viewBox='-20 -20 40 40'>\u003ccircle r='19' fill='#c47e3c'/>\u003ccircle r='13' fill='#ecd29f'/>${Array.from({ length: 8 }, (_, k) => `\u003ccircle cx='${f2(8 * Math.cos(k * Math.PI / 4))}' cy='${f2(8 * Math.sin(k * Math.PI / 4))}' r='1.3' fill='#7d4a1f'/>`).join('')}\u003ccircle r='1.6' fill='#7d4a1f'/>\u003c/svg>`, 22, 22)}` },\n    'Tandir noni va chekich naqshi — baraka muhri', 'Тандырная лепёшка с узором чекича — печать достатка');\n  }\n\n  return T.map((t) => t.id);\n}\n\nreturn register(ctx);"},{"key":"premium","label":"Премиум","code":"// Премиум-коллекция Walima: 10 дизайнов «как дорогая бумажная полиграфия».\n// Фольга (золото, шампань, розовое золото, медь, серебро) — градиенты в SVG и медленный блик,\n// который проходит только по линиям (маска из тех же линий, движется transform).\n// Тиснение — двойная тень (светлая сверху, тёмная снизу). Бархат и бумага — шум feTurbulence.\n// Никаких живых существ, только восьмиконечные звёзды.\nfunction register({ THEMES, EXTRA, SINGLE, THEME_DESC, star8, svgUri }) {\n  /* ───────── общие помощники ───────── */\n  const esc = (s) => String(s ?? '').replace(/ʻ/g, '‘').replace(/ʼ/g, '’').replace(/[&\u003c>\"']/g, (c) => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\n  const BRIDE = new Set(['kyz', 'qizoshi']);\n  const up = (s, lang) => String(s || '').toLocaleUpperCase(lang === 'ru' || lang === 'uzc' ? 'ru' : 'en');\n  // кого показываем на обложке: пара, один человек или инициалы\n  function who(d) {\n    const g = (d.groom || '').trim(), b = (d.bride || '').trim();\n    if (d.nameMode === 'initials') return { ini: true, g: g[0] || '', b: b[0] || '', list: [g[0] || '', b[0] || ''].filter(Boolean) };\n    if (d.nameMode === 'groom') return { one: true, list: [g], g, b: '' };\n    if (BRIDE.has(d.event)) return { one: true, list: [b || g], g: b || g, b: '' };\n    return { list: [g, b].filter(Boolean), g, b, one: !b };\n  }\n  const inis = (d) => { const w = who(d); return w.one ? [(w.list[0] || '')[0] || ''] : [(w.g || '')[0] || '', (w.b || '')[0] || '']; };\n  const AR = 'بَارَكَ اللَّهُ لَكُمَا'; // «Да благословит Аллах вас обоих» — дуа молодым\n\n  // металлы фольги: тёмный край → блик → середина → блик → край\n  const FOIL = {\n    gold: ['#8a672a', '#f2d998', '#b48c3c', '#fff1c4', '#a07b35', '#e9c97f', '#7c5c24'],\n    champ: ['#94805f', '#f3e8cf', '#bfa67b', '#fffaee', '#a68e6b', '#e6d5b2', '#8a7657'],\n    rose: ['#91574a', '#f1c6b1', '#bc7f6d', '#fde4d7', '#a06657', '#e5b09b', '#844e3e'],\n    copper: ['#7a3d20', '#eaa476', '#a85c34', '#f8c6a2', '#8e4c2a', '#da8f60', '#6c3418'],\n    silver: ['#7c848f', '#eef2f6', '#a3aab4', '#ffffff', '#8c939d', '#d7dde4', '#6c7480'],\n  };\n  const foil = (id, k, x1, y1, x2, y2) => `\u003clinearGradient id=\"${id}\" gradientUnits=\"userSpaceOnUse\" x1=\"${x1}\" y1=\"${y1}\" x2=\"${x2}\" y2=\"${y2}\">${FOIL[k].map((c, i, a) => `\u003cstop offset=\"${(i / (a.length - 1)).toFixed(3)}\" stop-color=\"${c}\"/>`).join('')}\u003c/linearGradient>`;\n  const foilCss = (k, deg = 115) => `linear-gradient(${deg}deg,${FOIL[k].map((c, i, a) => `${c} ${Math.round((i / (a.length - 1)) * 100)}%`).join(',')})`;\n  // блик: узкая светлая полоса, едет по маске из тех же линий\n  const shine = (id, maskInner, w, h, sw = 1.6) => `\n    \u003clinearGradient id=\"${id}-g\" x1=\"0\" x2=\"1\" y1=\"0\" y2=\"0\">\u003cstop offset=\"0\" stop-color=\"#fff\" stop-opacity=\"0\"/>\u003cstop offset=\".5\" stop-color=\"#fff\" stop-opacity=\".9\"/>\u003cstop offset=\"1\" stop-color=\"#fff\" stop-opacity=\"0\"/>\u003c/linearGradient>\n    \u003cmask id=\"${id}-m\" maskUnits=\"userSpaceOnUse\" x=\"-40\" y=\"-40\" width=\"${w + 80}\" height=\"${h + 80}\">\u003cg fill=\"none\" stroke=\"#fff\" stroke-width=\"${sw}\">${maskInner}\u003c/g>\u003c/mask>`;\n  // слой блика — ставить ПОСЛЕ линий, чтобы лежал поверх\n  const glint = (id, w, h, ang = 22) => `\u003cg mask=\"url(#${id}-m)\" class=\"psh-w\">\u003cg transform=\"rotate(${ang} ${w / 2} ${h / 2})\">\u003crect class=\"psh\" x=\"-70\" y=\"${-h}\" width=\"${Math.max(40, w * 0.2).toFixed(0)}\" height=\"${h * 3}\" fill=\"url(#${id}-g)\" style=\"--shx:${w + 140}px\"/>\u003c/g>\u003c/g>`;\n  const oct83 = (cx, cy, R, rot = 0) => { // восьмиконечная звезда {8/3} одной непрерывной линией\n    const P = (i) => { const a = (Math.PI / 4) * i - Math.PI / 2 + rot; return `${(cx + R * Math.cos(a)).toFixed(2)},${(cy + R * Math.sin(a)).toFixed(2)}`; };\n    return 'M' + [0, 3, 6, 1, 4, 7, 2, 5].map(P).join('L') + 'Z';\n  };\n  const starClip = star8(50, 50, 50, 39).split(' ').map((p) => p.split(',').map((v) => (+v).toFixed(1) + '%').join(' ')).join(',');\n  const starSvg = (cls = 'pst') => `\u003csvg class=\"${cls}\" viewBox=\"0 0 20 20\" aria-hidden=\"true\">\u003cpolygon points=\"${star8(10, 10, 9.5, 6.4)}\"/>\u003c/svg>`;\n  // шум бумаги/бархата: цвет пятнышек и их непрозрачность\n  const grainSvg = (rgb, a, freq = 0.85, size = 180, extra = '') => `\u003csvg xmlns='http://www.w3.org/2000/svg' width='${size}' height='${size}'>\u003cfilter id='n'>\u003cfeTurbulence type='fractalNoise' baseFrequency='${freq}' numOctaves='2' seed='7' stitchTiles='stitch'/>\u003cfeColorMatrix values='0 0 0 0 ${rgb[0]} 0 0 0 0 ${rgb[1]} 0 0 0 0 ${rgb[2]} 0 0 0 ${a} 0'/>\u003c/filter>\u003crect width='100%' height='100%' filter='url(%23n)'/>${extra}\u003c/svg>`;\n  // svgUri кодирует сам, но '#' внутри url(#n) нужно заранее — поэтому %23 выше; заменим обратно перед svgUri\n  const gUri = (s) => svgUri(s.replace(/%23/g, '#'));\n  // псевдослучайность с зерном — чтобы рваный край и сургуч были одинаковыми при каждом показе\n  const rng = (seed) => () => ((seed = (seed * 1103515245 + 12345) >>> 0) / 4294967296);\n\n  /* ───────── узоры фона ───────── */\n  EXTRA.patterns['p-velvet'] = (t) => gUri(grainSvg([1, 1, 1], t.velvet || 0.05, 0.95));\n  EXTRA.patterns['p-night'] = (t) => {\n    const st = [[22, 30, 2.6], [130, 58, 1.8], [78, 128, 3.2], [180, 150, 2], [40, 190, 1.6], [200, 20, 1.4], [150, 220, 2.4]];\n    return gUri(grainSvg([1, 1, 1], 0.035, 0.95, 240, st.map(([x, y, r]) => `\u003cpolygon points='${star8(x, y, r, r * 0.42)}' fill='${t.c.accent}' opacity='.22'/>`).join('')));\n  };\n  // бумага верже: тонкие горизонтальные линии и редкие вертикальные «цепные» — как у дорогой писчей бумаги\n  EXTRA.patterns['p-laid'] = (t) => gUri(`\u003csvg xmlns='http://www.w3.org/2000/svg' width='120' height='120'>\u003cfilter id='n'>\u003cfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='3' stitchTiles='stitch'/>\u003cfeColorMatrix values='0 0 0 0 .35 0 0 0 0 .27 0 0 0 0 .15 0 0 0 .07 0'/>\u003c/filter>\u003crect width='120' height='120' filter='url(%23n)'/>\n    \u003cg stroke='#7a5f33' stroke-opacity='.035' stroke-width='1'>${Array.from({ length: 40 }, (_, i) => `\u003cpath d='M0 ${i * 3 + 1.5}H120'/>`).join('')}\u003c/g>\u003cpath d='M60 0V120' stroke='#7a5f33' stroke-opacity='.05'/>\u003c/svg>`);\n  EXTRA.patterns['p-pearl'] = () => gUri(grainSvg([0.4, 0.36, 0.34], 0.035, 0.9));\n  EXTRA.patterns['p-stone'] = () => gUri(`\u003csvg xmlns='http://www.w3.org/2000/svg' width='260' height='260'>\u003cfilter id='a'>\u003cfeTurbulence type='fractalNoise' baseFrequency='.012' numOctaves='3' seed='11' stitchTiles='stitch'/>\u003cfeColorMatrix values='0 0 0 0 .35 0 0 0 0 .32 0 0 0 0 .28 0 0 0 .16 -.03'/>\u003c/filter>\u003cfilter id='b'>\u003cfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' seed='5' stitchTiles='stitch'/>\u003cfeColorMatrix values='0 0 0 0 .2 0 0 0 0 .18 0 0 0 0 .16 0 0 0 .1 0'/>\u003c/filter>\u003crect width='260' height='260' filter='url(%23a)'/>\u003crect width='260' height='260' filter='url(%23b)'/>\u003c/svg>`);\n  EXTRA.patterns['p-linen'] = () => gUri(`\u003csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'>\u003cfilter id='n'>\u003cfeTurbulence type='fractalNoise' baseFrequency='.04 .9' numOctaves='2' seed='9' stitchTiles='stitch'/>\u003cfeColorMatrix values='0 0 0 0 .4 0 0 0 0 .33 0 0 0 0 .22 0 0 0 .12 0'/>\u003c/filter>\u003cfilter id='m'>\u003cfeTurbulence type='fractalNoise' baseFrequency='.9 .04' numOctaves='2' seed='2' stitchTiles='stitch'/>\u003cfeColorMatrix values='0 0 0 0 .4 0 0 0 0 .33 0 0 0 0 .22 0 0 0 .1 0'/>\u003c/filter>\u003crect width='160' height='160' filter='url(%23n)'/>\u003crect width='160' height='160' filter='url(%23m)'/>\u003c/svg>`);\n  EXTRA.patterns['p-ink'] = (t) => gUri(grainSvg(t.dark ? [1, 1, 1] : [0.3, 0.25, 0.3], t.dark ? 0.03 : 0.03, 0.9));\n\n  /* ───────── общий премиальный слой для всех секций темы ───────── */\n  function common(t, metal) {\n    const id = `body.t-${t.id}`;\n    const btn = t.dark ? `${id} .btn:not(.ghost),${id} .big.y{background:linear-gradient(115deg,${FOIL[metal].slice(1, 6).map((c, i) => `${c} ${i * 25}%`).join(',')});border-color:transparent;color:${t.c.bg}}\n      ${id} .btn.ghost{border-color:var(--ln)}` : '';\n    return `\n${id} .h{font-weight:400;letter-spacing:.005em;font-size:30px}\n${id} .h::before{width:15px;height:15px;clip-path:polygon(${starClip});background:${foilCss(metal)};opacity:1}\n${id} .cv-ev{font:500 11px/1.7 var(--fb);letter-spacing:.32em;text-transform:uppercase;font-style:normal;color:var(--mu)}\n${id} .cv-wd{text-wrap:pretty}\n${id} .ay-orn,${id} .fn-orn{stroke:var(--ln)}\n${id} .ay-orn polygon,${id} .fn-orn polygon,${id} .stamp,${id} .rs-done polygon,${id} .cal-g b svg{fill:${t.c.accent}}\n${id} .paper{border-radius:2px}\n${id} .rd i{background:${foilCss(metal, 90)}}\n${id} .lf-d,${id} .ss-t,${id} .dt-h{font-weight:400}\n${id} ::selection{background:color-mix(in srgb,var(--ac) 28%,transparent)}\n${btn}\n${t.dark ? '' : `${id} main{text-shadow:0 1px 0 rgba(255,255,255,.55)}${id} .btn,${id} .big.y{text-shadow:none}`}\n@media (prefers-reduced-motion:reduce){${id} .psh-w{display:none}}\n.thumb .psh-w{display:none}`;\n  }\n  // общая анимация блика (transform), запускается после того как линии нарисовались\n  const SHINE_CSS = `.psh{transform:translateX(-80px)}.play .psh{animation:pSh 8s cubic-bezier(.45,0,.25,1) 3.6s infinite}\n@keyframes pSh{0%{transform:translateX(-80px)}34%,100%{transform:translateX(var(--shx))}}\n@keyframes pIn{from{opacity:0}to{opacity:1}}\n@keyframes pRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}`;\n\n  /* ════════════ 1. Zumrad muhr — изумрудный бархат, золотая печать-монограмма ════════════ */\n  EXTRA.covers['p-muhr'] = () => `\u003csvg class=\"cf zm-bg\" viewBox=\"0 0 320 470\" aria-hidden=\"true\">\n    \u003cdefs>${foil('zm-l', 'gold', 0, 0, 320, 470)}\u003c/defs>\n    \u003cpath d=\"M160 18V44M160 426V452\" stroke=\"url(#zm-l)\" stroke-width=\".8\" class=\"dr\" pathLength=\"1\"/>\n    \u003cpolygon points=\"${star8(160, 12, 4, 1.8)}\" fill=\"url(#zm-l)\" class=\"zm-dot\"/>\u003cpolygon points=\"${star8(160, 458, 4, 1.8)}\" fill=\"url(#zm-l)\" class=\"zm-dot\"/>\u003c/svg>`;\n  EXTRA.names['p-muhr'] = (d) => {\n    const w = who(d), I = inis(d);\n    const beads = Array.from({ length: 72 }, (_, i) => { const a = (i / 72) * Math.PI * 2; return `\u003ccircle cx=\"${(120 + 109 * Math.cos(a)).toFixed(2)}\" cy=\"${(120 + 109 * Math.sin(a)).toFixed(2)}\" r=\"1\"/>`; }).join('');\n    const sq = (r) => `\u003crect x=\"${120 - r}\" y=\"${120 - r}\" width=\"${2 * r}\" height=\"${2 * r}\"/>`;\n    const lines = `\u003ccircle cx=\"120\" cy=\"120\" r=\"114\"/>\u003ccircle cx=\"120\" cy=\"120\" r=\"104\" stroke-width=\".6\"/>\n      \u003cg stroke-width=\".7\">${sq(68)}\u003cg transform=\"rotate(45 120 120)\">${sq(68)}\u003c/g>\u003c/g>\u003ccircle cx=\"120\" cy=\"120\" r=\"60\" stroke-width=\".6\"/>`;\n    const mono = I.length === 1 ? `\u003ctext x=\"120\" y=\"142\" text-anchor=\"middle\" class=\"zm-i\">${esc(I[0])}\u003c/text>`\n      : `\u003ctext x=\"95\" y=\"139\" text-anchor=\"middle\" class=\"zm-i\">${esc(I[0])}\u003c/text>\u003ctext x=\"145\" y=\"139\" text-anchor=\"middle\" class=\"zm-i\">${esc(I[1])}\u003c/text>\u003cpath d=\"M120 98V142\" stroke=\"url(#zm-f)\" stroke-width=\".6\"/>`;\n    const nm = w.list.map((n) => `\u003cspan>${esc(up(n, d.lang))}\u003c/span>`).join(`\u003ci>${starSvg()}\u003c/i>`);\n    return `\u003csvg class=\"zm-seal\" viewBox=\"0 0 240 240\" aria-hidden=\"true\">\u003cdefs>${foil('zm-f', 'gold', 10, 10, 230, 230)}\n      ${shine('zm', lines + `\u003cg stroke=\"none\" fill=\"#fff\">${beads}\u003c/g>${mono.replace(/class=\"zm-i\"/g, 'class=\"zm-i\" fill=\"#fff\"')}`, 240, 240, 1.4)}\u003c/defs>\n      \u003cg fill=\"none\" stroke=\"url(#zm-f)\" stroke-width=\"1\" class=\"zm-ln\">${lines}\u003c/g>\u003cg fill=\"url(#zm-f)\" class=\"zm-bd\">${beads}\u003c/g>\n      \u003cg fill=\"url(#zm-f)\" class=\"zm-mo\">${mono}\u003c/g>\u003c/svg>\n      \u003ch1 class=\"zm-n\">${nm}\u003c/h1>`;\n  };\n  EXTRA.css['p-muhr'] = `${SHINE_CSS}\n.cv-p-muhr .cv-box{aspect-ratio:320/470}\n.cv-p-muhr .cv-in{padding:0 22px}\n.zm-seal{width:min(64%,232px);display:block;margin:18px auto 22px;overflow:visible;filter:drop-shadow(0 2px 1px rgba(0,0,0,.45))}\n.zm-ln *{vector-effect:non-scaling-stroke}\n.zm-i{font-family:var(--fd);font-weight:500;font-size:58px}\n.zm-n{font:500 21px/1.35 var(--fd);letter-spacing:.24em;color:var(--ink);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 14px;margin:0 -10px}\n.zm-n span{margin-right:-.24em}\n.zm-n i{display:inline-flex}.pst{width:10px;height:10px;fill:var(--ac)}\n.cv-p-muhr .cv-date{margin-top:20px;font-size:23px;font-style:italic}\n.js .cv .zm-seal,.js .cv .zm-n,.js .cv .zm-dot{opacity:0}\n.play .zm-seal{animation:pIn 1.6s ease forwards .3s}.play .zm-n{animation:pRise 1s cubic-bezier(.2,.8,.2,1) forwards 1.5s}.play .zm-dot{animation:pIn .8s ease forwards 1.6s}`;\n\n  /* ════════════ 2. Bordo peshtoq — бордовый бархат, пештак одной линией розового золота ════════════ */\n  EXTRA.covers['p-peshtoq'] = // Новый пустой блок для кнопки «+ Добавить»
function newBlock(type, lang = 'uz') {
  const D = getDef(lang);
  const base = { id: uid(), type, on: true };
  if (type === 'text') return { ...base, title: lbl(T_, lang), text: '' };
  if (type === 'program') return { ...base, title: D.program.title, items: [{ time: '', text: '' }] };
  if (type === 'contacts') return { ...base, title: D.contacts.title, items: [{ name: '', phone: '' }] };

function nextSaturday() {
  const d = new Date(); d.setDate(d.getDate() + 60); d.setDate(d.getDate() + ((6 - d.getDay() + 7) % 7));

}

const svgUri = (s) => `url("data:image/svg+xml,${enc(s.replace(/\s+/g, ' '))}")`;
const pt = (cx, cy, r, a) => `${(cx + r * Math.cos(a)).toFixed(2)},${(cy + r * Math.sin(a)).toFixed(2)}`;
// восьмиконечная звезда (два квадрата) — основа исламской геометрии
function star8(cx, cy, R, r = R * 0.765) {
  const p = [];
  for (let i = 0; i < 16; i++) p.push(pt(cx, cy, i % 2 ? r : R, (Math.PI / 8) * i - Math.PI / 2));
  return p.join(' ');
}

      const sp = (x, y, rot) => `<g transform='translate(${x} ${y}) rotate(${rot})' fill='${a}'><path d='M0 0V-34' stroke='${a2}' stroke-width='1'/>${[-30, -24, -18, -12].map((yy, i) => `<ellipse cx='${i % 2 ? 2.5 : -2.5}' cy='${yy}' rx='2.2' ry='3.6'/>`).join('')}<ellipse cx='0' cy='-35' rx='1.8' ry='3'/></g>`;

      break;

      break;
    }
    case 'woodgrain': {
      svg = `<svg xmlns='http://www.w3.org/2000/svg' width='80' height='200' fill='none' stroke='${a}' stroke-width='.8' opacity='.12'><path d='M10 0C14 50 6 100 12 200M30 0C36 60 24 120 32 200M52 0C50 40 62 90 54 200M70 0C74 70 66 130 72 200'/><ellipse cx='42' cy='96' rx='5' ry='12'/></svg>`;
      break;
    }
    case 'grain': {
      svg = `<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .3  0 0 0 0 .3  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(#g)' opacity='.18'/></svg>`;
      break;
    }
    case 'marble': {
      svg = `<svg xmlns='http://www.w3.org/2000/svg' width='420' height='420'><filter id='m'><feTurbulence type='fractalNoise' baseFrequency='.006 .018' numOctaves='4' seed='7'/>
        <feColorMatrix values='0 0 0 0 .45  0 0 0 0 .45  0 0 0 0 .43  0 0 0 -2.2 1.25'/></filter><rect width='100%' height='100%' filter='url(#m)' opacity='.33'/></svg>`;
      break;
    }
    default:

  }

}

/* ───────────────────────── дата ───────────────────────── */
function parts(d) {
  const [y, m, day] = String(d.date || '').split('-').map(Number);
  if (!y || !m || !day) return null;
  const wdIdx = (new Date(Date.UTC(y, m - 1, day)).getUTCDay() + 6) % 7; // пн=0
  return { y, m, day, wdIdx };
}
function calendarHtml(p, L) {
  const first = (new Date(Date.UTC(p.y, p.m - 1, 1)).getUTCDay() + 6) % 7;
  const days = new Date(Date.UTC(p.y, p.m, 0)).getUTCDate();
  let cells = '';
  for (let i = 0; i < first; i++) cells += '<i></i>';
  for (let n = 1; n <= days; n++) cells += n === p.day ? `<b class="on"><svg viewBox="0 0 40 40" aria-hidden="true"><polygon points="${star8(20, 20, 19, 15)}"/></svg><em>${n}</em></b>` : `<i>${n}</i>`;
  return `<div class="cal"><div class="cal-m">${L.months[p.m - 1]} ${p.y}</div><div class="cal-g">${L.wd.map((w) => `<u>${w}</u>`).join('')}${cells}</div></div>`;
}
function gcalUrl(d, title, place) {
  const p = parts(d); if (!p) return '';
  const [hh, mm] = String(d.time || '17:00').split(':').map(Number);
  const z = (n) => String(n).padStart(2, '0');
  const start = `${p.y}${z(p.m)}${z(p.day)}T${z(hh || 0)}${z(mm || 0)}00`;
  const end = `${p.y}${z(p.m)}${z(p.day)}T${z(Math.min(23, (hh || 0) + 4))}${z(mm || 0)}00`;
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${enc(title)}&dates=${start}/${end}&ctz=${MARKETS[marketOf(d)].ctz}&location=${enc(place || '')}`;
}

/* ───────────────────────── кыргызские буквы ───────────────────────── */
// Great Vibes не содержит ү ө ң (проверено в браузере). Если они есть в тексте —
// этот элемент целиком пишем курсивом основного шрифта, чтобы слово не «рассыпалось».
const NO_KG = new Set(['Great Vibes']);
const NO_UZC = new Set(['Prata', 'Yeseva One', 'Philosopher']); // нет ҳ (проверено в браузере)
const KG = /[үөңҮӨҢўқғҳЎҚҒҲʻ]/; // кыргызские и узбекские буквы
let _t = null; // текущая тема при рендере
const setTheme = (t) => { _t = t; };
const kg = (txt) => (_t && NO_KG.has(_t.f.script) && KG.test(String(txt || '')) ? ' kg' : '');

/* ───────────────────────── имена ───────────────────────── */
function coupleTitle(d) {
  const g = (d.groom || '').trim(), b = (d.bride || '').trim();
  if (d.nameMode === 'groom') return g;
  if (d.nameMode === 'initials') return [g[0], b[0]].filter(Boolean).join(' & ');
  if (BRIDE_EVENTS.has(d.event)) return b || g;
  return [g, b].filter(Boolean).join(' & ');
}
function namesHtml(d) {
  const g = esc((d.groom || '').trim()), b = esc((d.bride || '').trim());
  if (d.nameMode === 'initials') return `<span class="nm">${esc(g[0] || '')}</span><span class="amp">&amp;</span><span class="nm">${esc(b[0] || '')}</span>`;
  if (d.nameMode === 'groom') return `<span class="nm">${g}</span>`;
  if (BRIDE_EVENTS.has(d.event)) return `<span class="nm">${b || g}</span>`;
  return `<span class="nm">${g}</span><span class="amp">&amp;</span><span class="nm">${b}</span>`;
}
// Подстановка имён в текст с учётом режима «скрыть имя невесты»
function inviteText(text, d) {
  let s = String(text || '');
  const hide = (d.nameMode === 'groom' || d.nameMode === 'initials') && !BRIDE_EVENTS.has(d.event);
  if (hide) {
    // шаблонный текст меняем на готовый вариант «только жених»; свой текст пользователя — аккуратно чистим
    const D = getDef(d.lang);
    if (s === D.invite.text[d.event] && D.invite.hidden[d.event]) s = D.invite.hidden[d.event];
    s = s.replace(/ менен (келинибиз )?\{bride\}/g, '').replace('жатышат', 'жатат').replace('кыйдырышты', 'кыйдырды')
      .replace(/наших детей — \{groom\} и \{bride\}/g, 'нашего сына {groom}').replace(/ и \{bride\}/g, '').replace(/\{bride\}/g, '');
  }
  const groom = d.nameMode === 'initials' ? ((d.groom || '').trim()[0] || '') + '.' : d.groom || '';
  return fill(s, { groom, bride: d.bride || '' });
}

const H = (title) => (title ? `<h2 class="h">${esc(title)}</h2>` : '');

function section(b, d, t, L, opts) {

        ${b.place ? `<p class="place">${esc(b.place)}</p>` : ''}${b.address ? `<p class="addr">${nl(b.address)}</p>` : ''}${opts.thumb ? '' : maps}</div></section>`;

const MAP_URL = { '2gis': (q) => `https://2gis.kg/search/${enc(q)}`, google: (q) => `https://www.google.com/maps/search/?api=1&query=${enc(q)}`, yandex: (q) => `https://yandex.uz/maps/?text=${enc(q)}` };

function venuePlace(d) {

/* ───────────────────────── стили ───────────────────────── */
// Single-weight fonts break with ital/wght axes: normalize per family
const SINGLE = new Set(['Great Vibes', 'Bad Script', 'Prata', 'Forum', 'Yeseva One', 'Philosopher', 'Marmelad']);
function fontsHrefSafe(themes) {
  const map = new Map([['Amiri', 'wght@400;700']]);
  for (const t of themes) for (const [role, n] of Object.entries(t.f)) {
    if (NO_KG.has(n)) map.set('Cormorant Garamond', 'ital,wght@0,400;0,500;0,600;1,400;1,500');
    if (SINGLE.has(n)) { map.set(n, ''); continue; }
    if (role === 'display') map.set(n, 'ital,wght@0,400;0,500;0,600;1,400');
    else if (!map.has(n)) map.set(n, 'wght@400;500;600');
    else if (n === 'Cormorant Garamond' && role !== 'display') map.set(n, 'ital,wght@0,400;0,500;0,600;1,400;1,500');
  }
  return 'https://fonts.googleapis.com/css2?' + [...map].map(([n, w]) => 'family=' + n.replace(/ /g, '+') + (w ? ':' + w : '')).join('&') + '&display=swap';
}

function themeVars(t) {
  const c = t.c;
  return `:root{--bg:${c.bg};--bg2:${c.bg2};--sf:${c.surface};--ink:${c.ink};--mu:${c.muted};--ac:${c.accent};--ac2:${c.accent2};--ln:${c.line};
  --fd:'${t.f.display}',serif;--fs:'${t.f.script}',cursive;--fb:'${t.f.body}',serif;--fa:'Amiri',serif;--pat:${patternCss(t)};--fx:${t.fx || 'none'};--btn-ink:${t.dark ? c.bg : '#fff'}}`;
}
