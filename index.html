function nextSaturday() {

}

const svgUri = (s) => `url("data:image/svg+xml,${enc(s.replace(/\s+/g, ' '))}")`;
const pt = (cx, cy, r, a) => `${(cx + r * Math.cos(a)).toFixed(2)},${(cy + r * Math.sin(a)).toFixed(2)}`;
// восьмиконечная звезда (два квадрата) — основа исламской геометрии
function star8(cx, cy, R, r = R * 0.765) {
  const p = [];
  for (let i = 0; i < 16; i++) p.push(pt(cx, cy, i % 2 ? r : R, (Math.PI / 8) * i - Math.PI / 2));
  return p.join(' ');
}

function patternCss(t) {

        <polygon points='${star8(h, h, h)}'/><polygon points='${star8(h, h, h * 0.52)}'/>
        <polygon points='${star8(0, 0, h)}'/><polygon points='${star8(s, 0, h)}'/><polygon points='${star8(0, s, h)}'/><polygon points='${star8(s, s, h)}'/>

/* ───────────────────────── дата ───────────────────────── */
function parts(d) {
  const [y, m, day] = String(d.date || '').split('-').map(Number);
  if (!y || !m || !day) return null;
  const wdIdx = (new Date(Date.UTC(y, m - 1, day)).getUTCDay() + 6) % 7; // пн=0
  return { y, m, day, wdIdx };
}
function calendarHtml(p, L) {
  const first = (new Date(Date.UTC(p.y, p.m - 1, 1)).getUTCDay() + 6) % 7;
  const days = new Date(Date.UTC(p.y, p.m, 0)).getUTCDate();
  let cells = '';
  for (let i = 0; i < first; i++) cells += '<i></i>';
  for (let n = 1; n <= days; n++) cells += n === p.day ? `<b class="on"><svg viewBox="0 0 40 40" aria-hidden="true"><polygon points="${star8(20, 20, 19, 15)}"/></svg><em>${n}</em></b>` : `<i>${n}</i>`;
  return `<div class="cal"><div class="cal-m">${L.months[p.m - 1]} ${p.y}</div><div class="cal-g">${L.wd.map((w) => `<u>${w}</u>`).join('')}${cells}</div></div>`;
}
function gcalUrl(d, title, place) {
  const p = parts(d); if (!p) return '';
  const [hh, mm] = String(d.time || '17:00').split(':').map(Number);
  const z = (n) => String(n).padStart(2, '0');
  const start = `${p.y}${z(p.m)}${z(p.day)}T${z(hh || 0)}${z(mm || 0)}00`;
  const end = `${p.y}${z(p.m)}${z(p.day)}T${z(Math.min(23, (hh || 0) + 4))}${z(mm || 0)}00`;
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${enc(title)}&dates=${start}/${end}&ctz=${MARKETS[marketOf(d)].ctz}&location=${enc(place || '')}`;
}

  if (d.nameMode === 'initials') return [g[0], b[0]].filter(Boolean).join(' & ');
  if (BRIDE_EVENTS.has(d.event)) return b || g;
  return [g, b].filter(Boolean).join(' & ');

  if (d.nameMode === 'initials') return `<span class="nm">${esc(g[0] || '')}</span><span class="amp">&amp;</span><span class="nm">${esc(b[0] || '')}</span>`;
  if (d.nameMode === 'groom') return `<span class="nm">${g}</span>`;
  if (BRIDE_EVENTS.has(d.event)) return `<span class="nm">${b || g}</span>`;
  return `<span class="nm">${g}</span><span class="amp">&amp;</span><span class="nm">${b}</span>`;

// Подстановка имён в текст с учётом режима «скрыть имя невесты»
function inviteText(text, d) {
  let s = String(text || '');
  const hide = (d.nameMode === 'groom' || d.nameMode === 'initials') && !BRIDE_EVENTS.has(d.event);
  if (hide) {
    // шаблонный текст меняем на готовый вариант «только жених»; свой текст пользователя — аккуратно чистим
    const D = getDef(d.lang);
    if (s === D.invite.text[d.event] && D.invite.hidden[d.event]) s = D.invite.hidden[d.event];
    s = s.replace(/ менен (келинибиз )?\{bride\}/g, '').replace('жатышат', 'жатат').replace('кыйдырышты', 'кыйдырды')
      .replace(/наших детей — \{groom\} и \{bride\}/g, 'нашего сына {groom}').replace(/ и \{bride\}/g, '').replace(/\{bride\}/g, '');
  }
  const groom = d.nameMode === 'initials' ? ((d.groom || '').trim()[0] || '') + '.' : d.groom || '';
  return fill(s, { groom, bride: d.bride || '' });
}

      const round = t.cover === 'plate' || t.cover === 'medallion';

        ${t.mono ? `<p class="cv-ar" lang="ar" dir="rtl">بَارَكَ اللَّهُ لَكُمَا</p>` : ''}${round ? '' : `<p class="cv-kicker">${esc(title)}</p>`}<h1 class="names${kg((d.groom || '') + (d.bride || ''))}">${namesHtml(d)}</h1>${divider()}<p class="cv-date">${dateLine}</p>

      const rows = [b.men && b.menTime ? row(L.men, b.menTime, b.menText) : '', b.women && b.womenTime ? row(L.women, b.womenTime, b.womenText, b.tugunsiz ? `<p class="ses-n">${esc(L.tugunsiz)}</p>` : '') : ''].filter(Boolean);

    case 'program': {

    }
    case 'venue': {
      const q = [b.place, b.address].filter(Boolean).join(', ');
      const link = safeUrl(b.map);
      const maps = link ? `<a class="btn" href="${esc(link)}" target="_blank" rel="noopener">${L.mapOpen}</a>`
        : q ? `<div class="maps">${MARKETS[marketOf(d)].maps.map((m, i) => `<a class="btn${i ? ' ghost' : ''}" href="${MAP_URL[m](q)}" target="_blank" rel="noopener">${MAP_NAME[m]}</a>`).join('')}</div>` : '';
      return `<section class="s rv"><div class="card">${H(b.title)}<svg class="v-ic" viewBox="0 0 48 48" aria-hidden="true"><path d="M6 44V22c0-6 8-10 18-18 10 8 18 12 18 18v22z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M18 44V30a6 6 0 0 1 12 0v14" fill="none" stroke="currentColor" stroke-width="1.4"/><polygon points="${star8(24, 18, 3.4, 1.7)}" fill="currentColor"/></svg>
        ${b.place ? `<p class="place">${esc(b.place)}</p>` : ''}${b.address ? `<p class="addr">${nl(b.address)}</p>` : ''}${opts.thumb ? '' : maps}</div></section>`;
    }

function venuePlace(d) {
  const v = (d.blocks || []).find((b) => b.type === 'venue' && b.on);

// Single-weight fonts break with ital/wght axes: normalize per family
const SINGLE = new Set(['Great Vibes', 'Bad Script', 'Prata', 'Forum', 'Yeseva One', 'Philosopher', 'Marmelad']);
function fontsHrefSafe(themes) {
  const map = new Map([['Amiri', 'wght@400;700']]);
  for (const t of themes) for (const [role, n] of Object.entries(t.f)) {
    if (NO_KG.has(n)) map.set('Cormorant Garamond', 'ital,wght@0,400;0,500;0,600;1,400;1,500');
    if (SINGLE.has(n)) { map.set(n, ''); continue; }
    if (role === 'display') map.set(n, 'ital,wght@0,400;0,500;0,600;1,400');
    else if (!map.has(n)) map.set(n, 'wght@400;500;600');
    else if (n === 'Cormorant Garamond' && role !== 'display') map.set(n, 'ital,wght@0,400;0,500;0,600;1,400;1,500');
  }
  return 'https://fonts.googleapis.com/css2?' + [...map].map(([n, w]) => 'family=' + n.replace(/ /g, '+') + (w ? ':' + w : '')).join('&') + '&display=swap';
}

${doors}<main class="inv">${body}</main>${foot}

function initials(d) {
  const g = (d.groom || '').trim()[0] || '', b = (d.bride || '').trim()[0] || '';
  if (d.nameMode === 'groom' || !b) return g;
  if (BRIDE_EVENTS.has(d.event)) return b;
  return g + '&' + b;
}

// Имена «пишутся от руки»: SVG-текст с обводкой, затем заливка
function namesSvg(d, t) {
  const g = (d.groom || '').trim(), b = (d.bride || '').trim();
  let lines;
  if (d.nameMode === 'initials') lines = [[g[0] || '', 'nd'], ['&', 'amp'], [b[0] || '', 'nd']];
  else if (d.nameMode === 'groom') lines = [[g, 'nd']];
  else if (BRIDE_EVENTS.has(d.event)) lines = [[b || g, 'nd']];
  else lines = [[g, 'nd'], ['&', 'amp'], [b, 'nd']];
  const k = kg(g + b);
  const ys = lines.length === 1 ? [118] : [76, 128, 192];
  return `<svg class="nm${k}" viewBox="0 0 340 220" role="img" aria-label="${esc(lines.map((l) => l[0]).join(' '))}">
    ${lines.map(([txt, c], i) => `<text x="170" y="${ys[i]}" class="${c}" text-anchor="middle">${esc(txt)}</text>`).join('')}</svg>`;
}
// Монограмма: крупные инициалы в тонком кольце, имена — строкой ниже
function monogramSvg(d) {
  const g = (d.groom || '').trim()[0] || '', b = (d.bride || '').trim()[0] || '';
  const one = d.nameMode !== 'both' || BRIDE_EVENTS.has(d.event) || !b;
  const ini = one ? (BRIDE_EVENTS.has(d.event) ? b || g : g) : '';
  return `<svg class="mono" viewBox="0 0 300 300" aria-hidden="true"><circle cx="150" cy="150" r="138" class="cf-ln dr" pathLength="1"/><circle cx="150" cy="150" r="126" class="cf-ln thin dr" pathLength="1"/>
    ${one ? `<text x="150" y="196" text-anchor="middle" class="mi">${esc(ini)}</text>` : `<text x="98" y="190" text-anchor="middle" class="mi">${esc(g)}</text><text x="150" y="170" text-anchor="middle" class="ma">&amp;</text><text x="202" y="190" text-anchor="middle" class="mi">${esc(b)}</text>`}</svg>`;
}
function namesLine(d) {
  const g = esc((d.groom || '').trim()), b = esc((d.bride || '').trim());
  if (d.nameMode === 'groom' || (d.nameMode === 'initials')) return g;
  if (BRIDE_EVENTS.has(d.event)) return b || g;
  return `${g} <span>&amp;</span> ${b}`;
}
// Абстрактная карта района (без реальных данных): улицы по хэшу названия
function mapSvg(seed) {
  let h = 0; for (const c of String(seed)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const r = () => ((h = (h * 1103515245 + 12345) >>> 0) / 4294967296);
  // сетка улиц с шагом 24, смещение — от названия; две главные дороги и полоса реки
  const gx = (r() * 24) | 0, gy = (r() * 24) | 0, S = 24;
  let grid = '';
  for (let x = gx - S; x <= 340 + S; x += S) grid += `M${x} -10V210`;
  for (let y = gy - S; y <= 200 + S; y += S) grid += `M-10 ${y}H350`;
  const ry = 150 + ((r() * 24) | 0), mx = 60 + ((r() * 40) | 0), my = 30 + ((r() * 30) | 0);
  return `<svg viewBox="0 0 340 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="340" height="200" class="mp-bg"/>
    <path d="${grid}" class="mp-g"/>
    <path d="M-10 ${ry}C70 ${ry - 40} 130 ${ry + 30} 210 ${ry - 6}S310 ${ry - 40} 350 ${ry - 24}" class="mp-w"/>
    <path d="M-10 ${my + 8}C90 ${my - 10} 220 ${my + 26} 350 ${my + 4}" class="mp-r big"/>
    <path d="M${mx} -10C${mx + 12} 70 ${mx - 10} 140 ${mx + 6} 210" class="mp-r"/></svg>`;
}

/* ───────────── время дня: мужчины / женщины / общее ───────────── */
function sessionRows(d, L) {
  const b = (d.blocks || []).find((x) => x.type === 'sessions' && x.on);
  if (!b) return [];
  const r = [];
  if (b.men && b.menTime) r.push({ who: L.men, time: b.menTime, text: b.menText, cls: 'm' });
  if (b.women && b.womenTime) r.push({ who: L.women, time: b.womenTime, text: b.womenText, note: b.tugunsiz ? L.tugunsiz : '', cls: 'w' });
  if (b.all && b.allTime) r.push({ who: L.all, time: b.allTime, text: b.allText, cls: 'a' });
  return r.sort((x, y) => x.time.localeCompare(y.time));
}

        <div class="rs-done"><svg viewBox="0 0 80 80" aria-hidden="true"><polygon points="${star8(40, 40, 36, 28)}"/><path d="M27 41l9 9 17-19"/></svg><p class="rs-t"></p><button type="button" class="again">${esc(g.change)}</button></div></form></section>`;
    case 'text':
      if (!b.title && !b.text) return '';
      return `<section class="tx">${b.title ? `<h2 class="h">${esc(b.title)}</h2>` : ''}${b.text ? `<p class="txt">${nl(b.text)}</p>` : ''}</section>`;

    default:
      return '';
  }
}

function bandPat(t) {
  if (!['adras', 'chapan', 'gilam', 'paxtagul'].includes(t.pattern)) return 'none';
  return patternCss(t).replace(/opacity%3D'\.\d+'/, "opacity%3D'.95'").replace(/opacity='\.\d+'/, "opacity='.95'");
}

.mp-bg{fill:var(--bg2)}.mp-g{stroke:var(--ink);stroke-opacity:.12;stroke-width:1;fill:none}
.mp-r{stroke:var(--bg);stroke-width:8;fill:none;stroke-linecap:round}.mp-r.big{stroke-width:10}.mp-w{fill:none;stroke:var(--ac2);stroke-width:20;stroke-linecap:round;opacity:.3}
.pin{position:absolute;left:50%;top:50%;width:40px;height:52px;margin:-26px 0 0 -20px;fill:var(--ac);filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.pin-s{fill:var(--btn-ink)}
.pulse{position:absolute;left:50%;top:50%;width:14px;height:6px;margin:23px 0 0 -7px;border-radius:50%;background:rgba(0,0,0,.25)}
.pulse::after{content:"";position:absolute;inset:-14px -22px;border-radius:50%;border:2px solid var(--ac);opacity:0;animation:pulse 2.4s ease-out infinite 1s}
@keyframes pulse{0%{transform:scale(.3);opacity:.8}100%{transform:scale(1.4);opacity:0}}
.js .vn-card .pin{transform:translateY(-60px);opacity:0}
.vn-card.in .pin{animation:drop .7s cubic-bezier(.3,1.4,.5,1) forwards .2s}
@keyframes drop{to{transform:none;opacity:1}}
.vn-b{padding:20px 20px 22px}
.vn-p{font-family:var(--fd);font-size:25px;line-height:1.2}
.vn-a{color:var(--mu);margin-top:6px;font-size:15.5px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btns .btn{flex:1 1 auto;min-height:46px;padding:0 18px}
/* ── дресс-код ── */
.sw{display:flex;justify-content:center;margin-top:20px}
.sw i{width:58px;height:58px;border-radius:50%;border:3px solid var(--bg);margin-left:-12px;box-shadow:0 6px 14px -8px rgba(0,0,0,.4)}
.sw i:first-child{margin-left:0}
/* ── контакты ── */
.ct-r{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--ln);text-align:left}
.ct-n{font-family:var(--fd);font-size:21px;line-height:1.2}.ct-p{color:var(--mu);font-size:15px;font-variant-numeric:tabular-nums}
.ct-b{display:flex;gap:8px}
.ct-b a{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--ln);color:var(--ac)}
.ct-b svg{width:20px;height:20px}
/* ── ответ гостя ── */
.rs{padding-bottom:40px}
.rs-ch{display:grid;gap:10px}
.big{min-height:58px;border-radius:18px;font:600 17px var(--fb);border:1px solid var(--ln);background:var(--sf);color:var(--ink);cursor:pointer;transition:transform .12s ease-out,background .2s,border-color .2s}
.big:active{transform:scale(.98)}
.big.y{background:var(--ac);border-color:var(--ac);color:var(--btn-ink)}
.rsf[data-att="1"] .big.n,.rsf[data-att="0"] .big.y{opacity:.45}
.rsf[data-att="0"] .big.n{border-color:var(--ac);color:var(--ac)}
.rs-more{display:grid;gap:14px;text-align:left;max-height:0;overflow:hidden;opacity:0;transition:max-height .6s cubic-bezier(.2,.8,.2,1),opacity .4s ease,margin .4s}
.rsf[data-att] .rs-more{max-height:640px;opacity:1;margin-top:20px}
.fl{display:grid;gap:6px}.fl span{font-size:14px;color:var(--mu)}
.fl input,.fl textarea{width:100%;font:16px var(--fb);color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:13px 14px;outline:none}
.fl input:focus,.fl textarea:focus{border-color:var(--ac)}
.cnt{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px}
.cnt div{display:flex;align-items:center;gap:8px}
.cnt button{width:44px;height:44px;border-radius:50%;border:1px solid var(--ln);background:var(--sf);color:var(--ac);font-size:22px;cursor:pointer}
.cnt output{min-width:30px;text-align:center;font-family:var(--fd);font-size:26px}
.r-msg{text-align:center;font-size:14.5px;color:var(--mu)}
.rs-done{display:none;justify-items:center;gap:10px;padding:10px 0}
.rs-done svg{width:76px;height:76px}.rs-done polygon{fill:var(--ac)}.rs-done path{fill:none;stroke:var(--btn-ink);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40}
.rsf.done .rs-done{display:grid}.rsf.done .rs-done path{animation:write .6s ease forwards .2s}
.rsf.done .rs-ch,.rsf.done .rs-more{display:none}
.rs-priv{margin:14px auto 0;max-width:320px;font-size:12px;line-height:1.45;color:var(--mu);text-align:center;overflow-wrap:anywhere}
.rs-priv a{color:inherit;text-decoration:underline}
.foot .rep{display:block;margin-top:8px;font-size:12px;border-bottom:0;text-decoration:underline;color:var(--mu)}
.rs-t{font-family:var(--fd);font-size:23px;line-height:1.3;max-width:300px}
.again{background:none;border:0;color:var(--mu);text-decoration:underline;font:14px var(--fb);cursor:pointer;margin-top:4px}
canvas.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:45}
/* ── финал ── */
.fn{padding:64px 0 30px}
.fn-orn{width:200px;height:40px;display:block;margin:0 auto 20px;fill:none;stroke:var(--ac)}
.fn-orn polygon{fill:var(--ac);stroke:none}
.fn-t{font-family:var(--fd);font-style:italic;font-size:27px;line-height:1.3}
.fn-t.kg{font-family:'Cormorant Garamond',var(--fd)}
.foot{position:relative;z-index:1;text-align:center;padding:10px 20px 40px;font-size:13px;color:var(--mu)}
.foot a{color:var(--ac);text-decoration:none;border-bottom:1px solid var(--ln)}
/* ── миниатюра ── */
.thumb section:not(.cv){display:none}.thumb .cv{padding:0;min-height:100vh}.thumb .bgp{position:absolute}
@media (prefers-reduced-motion:reduce){
  .js .cv .dr{stroke-dashoffset:0}.js .cv *{opacity:1!important;animation:none!important}.js .cv .nm text{stroke-dashoffset:0;fill-opacity:1;stroke-width:0}
  .door{transition:none}.js .ay-ar span{opacity:1}.js .ay-tr{opacity:1;transform:none}.js .paper[data-in]{transform:none;opacity:1}
  .stamp{opacity:.95;transform:rotate(-10deg)}.js .vn-card .pin{transform:none;opacity:1}.hint svg,.pulse::after{animation:none}}
`;

/* ───────────── код страницы гостя (выполняется в браузере гостя) ───────────── */
function client() {
  var W = window.WALIMA || {}, d = document, root = d.documentElement;
  root.classList.add('js');
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var qs = new URLSearchParams(location.search), guest = (qs.get('g') || W.guest || '').trim().slice(0, 60);
  var fill = function (sel, v) { var el = d.querySelector(sel); if (el) el.textContent = v; };
  fill('.gc-to', guest ? W.T.dear.replace('{g}', guest) : W.T.dearNone);
  var nameInput = d.querySelector('[data-rsvp] [name=name]'); if (nameInput && guest) nameInput.value = guest;

  // подогнать длинные имена под ширину
  function fitNames() {
    d.querySelectorAll('svg.nm text.nd').forEach(function (t) {
      try { var w = t.getComputedTextLength(); if (w > 320) t.style.fontSize = (parseFloat(getComputedStyle(t).fontSize) * 320 / w) + 'px'; } catch (e) {}
    });
  }
  var cover = d.querySelector('[data-cv]');
  function play() { (d.fonts && d.fonts.ready ? d.fonts.ready : Promise.resolve()).then(function () { fitNames(); if (cover) cover.classList.add('play'); }); }

  // ворота
  var gate = d.getElementById('gate');
  if (gate) {
    d.body.style.overflow = 'hidden';
    var opened = false;
    var open = function () {
      if (opened) return; opened = true;
      try { if (W.mode === 'demo' && parent !== window) parent.postMessage('walima-opened', '*'); } catch (e) {}
      try { navigator.vibrate && navigator.vibrate(12); } catch (e) {}
      gate.classList.add('open');
      setTimeout(play, reduce ? 0 : 650);
      setTimeout(function () { gate.classList.add('gone'); d.body.style.overflow = ''; }, reduce ? 50 : 1500);
      setTimeout(function () { gate.remove(); dispatchEvent(new Event('walima-gate-gone')); }, reduce ? 100 : 2200);
    };
    gate.querySelector('.btn').addEventListener('click', open);
    // в ленте дизайнов ворота открывает сам человек; лента пришлёт «открой», если дизайн простоял на экране 4 секунды
    if (W.mode === 'demo') addEventListener('message', function (e) { if (e.data === 'walima-open') open(); });
  } else play();

  // появление по месту (одно событие на элемент — печать, письмо, булавка карты)
  var io = 'IntersectionObserver' in window ? new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { threshold: 0.35 }) : null;
  d.querySelectorAll('[data-in]').forEach(function (el) { io ? io.observe(el) : el.classList.add('in'); });

  // движение, привязанное к прокрутке
  var bar = d.querySelector('.rd i'), bgp = d.querySelector('.bgp');
  var ay = d.querySelector('[data-scrub=ay]'), words = ay ? ay.querySelectorAll('.ay-ar span') : [];
  var sunSec = d.querySelector('[data-scrub=sun]'), path = d.getElementById('skyp'), sun = d.querySelector('.sun'), plen = path ? path.getTotalLength() : 0;
  var tl = d.querySelector('[data-scrub=tl]'), tlLine = tl && tl.querySelector('.tl-line'), tlItems = tl ? tl.querySelectorAll('.tl-it') : [];
  function prog(el, a, b) { var r = el.getBoundingClientRect(), vh = innerHeight; var p = (vh * a - r.top) / (r.height + vh * b); return Math.max(0, Math.min(1, p)); }
  var ticking = false;
  function frame() {
    ticking = false;
    var y = scrollY, H = d.documentElement.scrollHeight - innerHeight;
    if (bar) bar.style.transform = 'scaleX(' + (H > 0 ? y / H : 0) + ')';
    if (ay) { var p = prog(ay, 0.9, 0.05); var n = Math.ceil(p * words.length * 1.15); words.forEach(function (w, i) { w.classList.toggle('on', i < n); }); ay.classList.toggle('done', p > 0.75); }
    if (sun && path) { var sv = sunSec.querySelector('.sky'), f0 = +sv.dataset.from, f1 = +sv.dataset.to; var ps = prog(sunSec, 0.85, 0.15); var pt = path.getPointAtLength(plen * (f0 + (f1 - f0) * ps)); sun.setAttribute('transform', 'translate(' + pt.x + ' ' + pt.y + ') rotate(' + ps * 90 + ')'); }
    if (tl) { var pt2 = prog(tl, 0.75, 0.1); tlLine.style.setProperty('--p', pt2); tlItems.forEach(function (it, i) { it.classList.toggle('lit', pt2 >= (i + 0.35) / tlItems.length); }); }
  }
  addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(frame); } }, { passive: true });
  addEventListener('resize', frame); frame();
  if (reduce) { words.forEach(function (w) { w.classList.add('on'); }); if (ay) ay.classList.add('done'); }

  // обратный отсчёт
  var cd = d.querySelector('[data-cd]');
  if (cd && W.date) {
    var T = new Date(W.date + 'T' + (W.time || '00:00') + ':00' + (W.tz || '+05:00')).getTime(), u = cd.querySelectorAll('b');
    (function tick() {
      var s = Math.max(0, Math.floor((T - Date.now()) / 1000));
      var v = [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60), s % 60];
      v.forEach(function (x, i) { var t = (i ? (x < 10 ? '0' : '') : '') + x; if (u[i].textContent !== t) u[i].textContent = t; });
      if (s > 0) setTimeout(tick, 1000);
    })();
  }

  // ответ гостя
  var f = d.querySelector('[data-rsvp]');
  if (f) {
    var n = 1, out = f.querySelector('output'), msg = f.querySelector('.r-msg'), key = 'walima-rsvp-' + W.slug;
    var ridKey = key + '-rid', rec = null;
    try { rec = JSON.parse(localStorage.getItem(ridKey) || 'null'); } catch (e) {}
    var send = function (att, name, extra) {
      var body = { name: name, att: att, count: att ? n : 0, msg: extra ? f.msg.value.trim().slice(0, 500) : '' };
      if (rec && rec.rid) { body.rid = rec.rid; body.tok = rec.tok; }
      if (!extra && rec && rec.rid) body.msg = f.msg.value.trim().slice(0, 500);
      return fetch((W.api || '') + '/api/rsvp/' + encodeURIComponent(W.slug), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
        .then(function (r) { if (!r.ok) throw 0; return r.json().catch(function () { return {}; }); })
        .then(function (j) { if (j && j.rid) { rec = { rid: j.rid, tok: j.tok }; try { localStorage.setItem(ridKey, JSON.stringify(rec)); } catch (e) {} } try { localStorage.setItem(key, att ? '1' : '0'); } catch (e) {} });
    };
    // личная ссылка: имя известно — ответ записывается одним нажатием, остальное можно дописать
    // общая ссылка: имя неизвестно — запоминаем нажатие «Ha», считаем полуответ, при возвращении напоминаем
    var halfKey = key + '-half', isHalf = false;
    try { isHalf = !!localStorage.getItem(halfKey); } catch (e) {}
    var tap = function (dd) { if (W.mode !== 'live') return; try { fetch((W.api || '') + '/api/tap/' + encodeURIComponent(W.slug), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ d: dd }), keepalive: true }); } catch (e) {} };
    var quick = function (att) {
      var name = guest || '';
      if (!name) { if (att && !isHalf) { isHalf = true; try { localStorage.setItem(halfKey, '1'); } catch (e) {} tap(1); } return; }
      var sb = f.querySelector('[type=submit]'); sb.textContent = W.T.update;
      if (W.mode !== 'live') { msg.textContent = W.T.saved; return; }
      send(att, name, false).then(function () { msg.textContent = W.T.saved; }).catch(function () { msg.textContent = W.T.err; });
    };
    f.querySelectorAll('[data-att]').forEach(function (b) {
      b.addEventListener('click', function () {
        f.setAttribute('data-att', b.dataset.att);
        quick(b.dataset.att === '1');
        var c = f.querySelector('[data-cnt]'); if (c) c.style.display = b.dataset.att === '1' ? '' : 'none';
        setTimeout(function () { var i = f.querySelector('[name=name]'); if (i && !i.value) i.focus({ preventScroll: true }); f.querySelector('.rs-more').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' }); }, 120);
      });
    });
    var cnt = f.querySelector('[data-cnt]');
    if (cnt) cnt.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; n = Math.min(20, Math.max(1, n + Number(b.dataset.d))); out.textContent = n; });
    var done = function (att) {
      f.classList.add('done'); f.querySelector('.rs-t').textContent = att ? W.T.thanksYes : W.T.thanksNo;
      if (att && !reduce) burst();
    };
    f.querySelector('.again').addEventListener('click', function () { f.classList.remove('done'); });
    try { var saved = W.slug && localStorage.getItem(key); if (saved) done(saved === '1'); } catch (e) {}
    // вернулся гость, который нажал «Ha», но не написал имя: открываем форму и подводим к ней
    if (isHalf && !saved && !guest) {
      f.setAttribute('data-att', '1'); msg.textContent = W.T.pending;
      var toForm = function () { f.querySelector('.rs-more').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' }); };
      if (d.getElementById('gate')) addEventListener('walima-gate-gone', toForm); else setTimeout(toForm, 1800);
    }
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var att = f.getAttribute('data-att') === '1', name = f.name.value.trim();
      if (!name) { msg.textContent = W.T.needName; f.name.focus(); return; }
      if (W.mode !== 'live') { msg.textContent = W.T.preview; done(att); return; }
      var btn = f.querySelector('[type=submit]'); btn.disabled = true;
      send(att, name, true)
        .then(function () { msg.textContent = ''; if (isHalf) { isHalf = false; try { localStorage.removeItem(halfKey); } catch (e) {} tap(-1); } done(att); })
        .catch(function () { msg.textContent = W.T.err; })
        .finally(function () { btn.disabled = false; });
    });
  }

  // золотые звёздочки после «Да, приду»
  function burst() {
    var c = d.createElement('canvas'); c.className = 'fx'; d.body.appendChild(c);
    var x = c.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1); c.width = innerWidth * dpr; c.height = innerHeight * dpr; x.scale(dpr, dpr);
    var cs = getComputedStyle(root), cols = [cs.getPropertyValue('--ac').trim(), cs.getPropertyValue('--ac2').trim(), '#ffffff'];
    var ps = []; for (var i = 0; i < 90; i++) ps.push({ x: innerWidth / 2, y: innerHeight * 0.62, vx: (Math.random() - 0.5) * 9, vy: -Math.random() * 11 - 4, r: 3 + Math.random() * 5, a: Math.random() * 6, va: (Math.random() - 0.5) * 0.3, c: cols[i % 3], s: i % 2 });
    var t0 = performance.now();
    (function step(t) {
      var k = (t - t0) / 1000; x.clearRect(0, 0, innerWidth, innerHeight);
      ps.forEach(function (p) {
        p.vy += 0.32; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.a += p.va;
        x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.globalAlpha = Math.max(0, 1 - k / 2.4); x.fillStyle = p.c; x.beginPath();
        if (p.s) { for (var j = 0; j < 16; j++) { var R = j % 2 ? p.r * 0.45 : p.r, an = j * Math.PI / 8; x.lineTo(Math.cos(an) * R, Math.sin(an) * R); } }
        else { x.moveTo(0, -p.r); x.lineTo(p.r * 0.6, 0); x.lineTo(0, p.r); x.lineTo(-p.r * 0.6, 0); }
        x.closePath(); x.fill(); x.restore();
      });
      if (k < 2.4) requestAnimationFrame(step); else c.remove();
    })(t0);
  }
}

/* ───────────── страница целиком ───────────── */
// opts: { mode: 'live'|'preview'|'demo'|'thumb', slug, api, base, botUrl, guest }
function renderInvite(d, opts = {}) {
  let t = themeById(d.theme);
  if (d.lang === 'uzc' && NO_UZC.has(t.f.display)) t = { ...t, f: { ...t.f, display: 'Cormorant Garamond' } };
  if (d.lang === 'uzc' && NO_UZC.has(t.f.body)) t = { ...t, f: { ...t.f, body: 'Lora' } };
  setTheme(t);
  const L = L_(d.lang), g = G(d.lang);
  const thumb = opts.mode === 'thumb';
  const o = { ...opts, thumb };
  const blocks = (d.blocks || []).filter((b) => b.on && BLOCKS[b.type]);
  const hostsB = blocks.find((b) => b.type === 'hosts');
  const inviteB = blocks.find((b) => b.type === 'invite');
  const venueB = blocks.find((b) => b.type === 'venue');
  const ctx = {
    bism: blocks.some((b) => b.type === 'bismillah'),
    hosts: inviteB && hostsB ? hostsB : null, hostsInLetter: !!(inviteB && hostsB),
    place: venueB ? [venueB.place, venueB.address].filter(Boolean).join(', ') : '',
    rows: sessionRows(d, L),
  };
  const body = blocks.map((b) => section(b, d, t, L, g, o, ctx)).join('\n');
  const title = coupleTitle(d) || 'Walima';
  const F = fmtDate(d);
  const desc = `${L.events[d.event] || ''}${F ? `, ${F.day} ${F.year}` : ''}`;
  const gate = thumb || d.intro === false ? '' : `<div class="gate" id="gate"><div class="gl"></div><div class="door l">${doorSvg()}</div><div class="door r">${doorSvg()}</div>
    <div class="gc" role="dialog" aria-label="${esc(g.open)}"><p class="gc-hi">${esc(g.hello)}</p><p class="gc-to">${esc(g.dearNone)}</p><p class="gc-ev">${esc(L.events[d.event] || '')}${hostsB ? `<br>${esc(hostsB.text.split('\n')[0])}` : ''}</p>
    <button class="btn" type="button">${esc(g.open)}</button></div></div>`;
  const cfg = { slug: opts.slug || '', api: opts.api || '', mode: opts.mode || 'live', date: d.date, time: d.time, tz: MARKETS[marketOf(d)].tz, guest: opts.guest || '',
    T: { dear: g.dear, dearNone: g.dearNone, thanksYes: g.thanksYes, thanksNo: g.thanksNo, needName: g.needName, pending: g.pending, saved: g.saved, update: g.update, err: g.err, preview: g.preview } };
  const ogImg = opts.base && opts.slug ? `<meta property="og:image" content="${esc(opts.base)}/og/${marketOf(d)}-${esc(t.id)}.jpg"><meta property="og:url" content="${esc(opts.base)}/i/${esc(opts.slug)}">` : '';
  const foot = thumb ? '' : `<footer class="foot">${esc(g.made)} · <a href="${esc(opts.botUrl || '#')}" target="_blank" rel="noopener">${esc(g.own)}</a>${(opts.mode || 'live') === 'live' ? `<a class="rep" href="${opts.slug ? `https://t.me/walima_uz_bot?start=report_${encodeURIComponent(opts.slug)}` : 'https://t.me/walima_uz'}" target="_blank" rel="noopener">${esc(g.report)}</a>` : ''}</footer>`;
  return `<!doctype html><html lang="${{ ru: 'ru', ky: 'ky', uz: 'uz', uzc: 'uz-Cyrl' }[d.lang] || 'uz'}"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>${esc(title)} — ${esc(L.events[d.event] || '')}</title><meta name="description" content="${esc(desc)}"><meta name="theme-color" content="${t.c.bg2}">
<meta property="og:title" content="${esc(title)}"><meta property="og:description" content="${esc(desc)}"><meta property="og:type" content="website">${ogImg}
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="${fontsHrefSafe([t])}">
<style>${themeVars(t)}:root{--band:${bandPat(t)}}${CSS}</style></head>

function dwellWatch(root, sel, reset) {
  const t = new Map();
  addEventListener('message', (e) => { if (e.data !== 'walima-opened') return; root.querySelectorAll(sel + ' iframe').forEach((f) => { if (f.contentWindow === e.source) f.dataset.opened = '1'; }); });
  const io = new IntersectionObserver((es) => es.forEach((e) => {
    const f = e.target.querySelector('iframe'); if (!f) return;
    clearTimeout(t.get(f));
    if (e.intersectionRatio >= 0.75) t.set(f, setTimeout(() => { try { f.contentWindow?.postMessage('walima-open', '*'); } catch {} }, 4000));
    else if (e.intersectionRatio < 0.3 && f.dataset.opened) { delete f.dataset.opened; reset(f); }
  }), { root, threshold: [0, 0.3, 0.75] });
  root.querySelectorAll(sel).forEach((s) => io.observe(s));
  return io;
}
