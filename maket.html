/* Риштанская глазурь: фарфор, кобальт, бирюза; золото — только для праздничных моментов */

      const gul = (x, y, R) => `<g transform='translate(${x} ${y})'><polygon points='${Array.from({ length: 8 }, (_, i) => pt(0, 0, R, Math.PI / 8 + (i * Math.PI) / 4)).join(' ')}' fill='${a}' fill-opacity='.55'/><path d='M${-R * 0.5} 0H${R * 0.5}M0 ${-R * 0.5}V${R * 0.5}' stroke='${t.c.bg}' stroke-width='${R * 0.18}'/><rect x='${-R * 0.16}' y='${-R * 0.16}' width='${R * 0.32}' height='${R * 0.32}' fill='${a2}' transform='rotate(45)'/></g>`;
      svg = `<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90' opacity='.18'>${gul(45, 45, 16)}${gul(0, 0, 9)}${gul(90, 0, 9)}${gul(0, 90, 9)}${gul(90, 90, 9)}</svg>`;
      break;
    }
    case 'blossom': {
      // цвет урюка: редкие пятилепестковые цветки
      const fl = (x, y, r) => `<g transform='translate(${x} ${y})'>${[0, 72, 144, 216, 288].map((k) => `<ellipse cx='0' cy='${-r}' rx='${r * 0.62}' ry='${r * 0.9}' fill='${a}' fill-opacity='.5' transform='rotate(${k})'/>`).join('')}<circle r='${r * 0.4}' fill='${a2}'/></g>`;
      svg = `<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160' opacity='.3'>${fl(30, 36, 5)}${fl(118, 92, 4)}${fl(62, 132, 3.5)}<circle cx='100' cy='30' r='1.6' fill='${a2}'/><circle cx='20' cy='100' r='1.4' fill='${a2}'/><circle cx='140' cy='150' r='1.4' fill='${a}'/></svg>`;
      break;
    }
    case 'sprig': {
      // веточки лаванды
      const sp = (x, y, rot) => `<g transform='translate(${x} ${y}) rotate(${rot})' fill='${a}'><path d='M0 0V-34' stroke='${a2}' stroke-width='1'/>${[-30, -24, -18, -12].map((yy, i) => `<ellipse cx='${i % 2 ? 2.5 : -2.5}' cy='${yy}' rx='2.2' ry='3.6'/>`).join('')}<ellipse cx='0' cy='-35' rx='1.8' ry='3'/></g>`;
      svg = `<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' opacity='.22'>${sp(30, 56, -15)}${sp(92, 110, 12)}</svg>`;
      break;
    }
    case 'clouds': {
      svg = `<svg xmlns='http://www.w3.org/2000/svg' width='180' height='120' fill='none' stroke='${a}' stroke-width='1.1' opacity='.16'><path d='M20 70q0-14 14-14q4-12 18-10q10-8 20 2q14-2 14 12q10 2 8 12H22q-4 0-2-2z'/><path d='M110 30q0-9 9-9q3-8 12-6q7-5 13 1q9-1 9 8q6 1 5 8h-46q-3 0-2-2z'/></svg>`;
      break;
    }
    case 'woodgrain': {
      svg = `<svg xmlns='http://www.w3.org/2000/svg' width='80' height='200' fill='none' stroke='${a}' stroke-width='.8' opacity='.12'><path d='M10 0C14 50 6 100 12 200M30 0C36 60 24 120 32 200M52 0C50 40 62 90 54 200M70 0C74 70 66 130 72 200'/><ellipse cx='42' cy='96' rx='5' ry='12'/></svg>`;
      break;
    }
    case 'grain': {
      svg = `<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .3  0 0 0 0 .3  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(#g)' opacity='.18'/></svg>`;
      break;
    }
    case 'marble': {
      svg = `<svg xmlns='http://www.w3.org/2000/svg' width='420' height='420'><filter id='m'><feTurbulence type='fractalNoise' baseFrequency='.006 .018' numOctaves='4' seed='7'/>
        <feColorMatrix values='0 0 0 0 .45  0 0 0 0 .45  0 0 0 0 .43  0 0 0 -2.2 1.25'/></filter><rect width='100%' height='100%' filter='url(#m)' opacity='.33'/></svg>`;
      break;
    }
    default:
      return 'none';
  }
  return svgUri(svg);
}

/* ───────────────────────── дата ───────────────────────── */
function parts(d) {
  const [y, m, day] = String(d.date || '').split('-').map(Number);
  if (!y || !m || !day) return null;
  const wdIdx = (new Date(Date.UTC(y, m - 1, day)).getUTCDay() + 6) % 7; // пн=0
  return { y, m, day, wdIdx };
}
function calendarHtml(p, L) {
  const first = (new Date(Date.UTC(p.y, p.m - 1, 1)).getUTCDay() + 6) % 7;
  const days = new Date(Date.UTC(p.y, p.m, 0)).getUTCDate();
  let cells = '';
  for (let i = 0; i < first; i++) cells += '<i></i>';
  for (let n = 1; n <= days; n++) cells += n === p.day ? `<b class="on"><svg viewBox="0 0 40 40" aria-hidden="true"><polygon points="${star8(20, 20, 19, 15)}"/></svg><em>${n}</em></b>` : `<i>${n}</i>`;
  return `<div class="cal"><div class="cal-m">${L.months[p.m - 1]} ${p.y}</div><div class="cal-g">${L.wd.map((w) => `<u>${w}</u>`).join('')}${cells}</div></div>`;
}
function gcalUrl(d, title, place) {
  const p = parts(d); if (!p) return '';
  const [hh, mm] = String(d.time || '17:00').split(':').map(Number);
  const z = (n) => String(n).padStart(2, '0');
  const start = `${p.y}${z(p.m)}${z(p.day)}T${z(hh || 0)}${z(mm || 0)}00`;
  const end = `${p.y}${z(p.m)}${z(p.day)}T${z(Math.min(23, (hh || 0) + 4))}${z(mm || 0)}00`;
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${enc(title)}&dates=${start}/${end}&ctz=${MARKETS[marketOf(d)].ctz}&location=${enc(place || '')}`;
}

/* ───────────────────────── кыргызские буквы ───────────────────────── */
// Great Vibes не содержит ү ө ң (проверено в браузере). Если они есть в тексте —
// этот элемент целиком пишем курсивом основного шрифта, чтобы слово не «рассыпалось».
const NO_KG = new Set(['Great Vibes']);
const NO_UZC = new Set(['Prata', 'Yeseva One', 'Philosopher']); // нет ҳ (проверено в браузере)
const KG = /[үөңҮӨҢўқғҳЎҚҒҲʻ]/; // кыргызские и узбекские буквы
let _t = null; // текущая тема при рендере
const setTheme = (t) => { _t = t; };
const kg = (txt) => (_t && NO_KG.has(_t.f.script) && KG.test(String(txt || '')) ? ' kg' : '');

/* ───────────────────────── имена ───────────────────────── */
function coupleTitle(d) {
  const g = (d.groom || '').trim(), b = (d.bride || '').trim();
  if (d.nameMode === 'groom') return g;
  if (d.nameMode === 'initials') return [g[0], b[0]].filter(Boolean).join(' & ');
  if (BRIDE_EVENTS.has(d.event)) return b || g;
  return [g, b].filter(Boolean).join(' & ');
}
function namesHtml(d) {
  const g = esc((d.groom || '').trim()), b = esc((d.bride || '').trim());
  if (d.nameMode === 'initials') return `<span class="nm">${esc(g[0] || '')}</span><span class="amp">&amp;</span><span class="nm">${esc(b[0] || '')}</span>`;
  if (d.nameMode === 'groom') return `<span class="nm">${g}</span>`;
  if (BRIDE_EVENTS.has(d.event)) return `<span class="nm">${b || g}</span>`;
  return `<span class="nm">${g}</span><span class="amp">&amp;</span><span class="nm">${b}</span>`;
}
// Подстановка имён в текст с учётом режима «скрыть имя невесты»
function inviteText(text, d) {
  let s = String(text || '');
  const hide = (d.nameMode === 'groom' || d.nameMode === 'initials') && !BRIDE_EVENTS.has(d.event);
  if (hide) {
    // шаблонный текст меняем на готовый вариант «только жених»; свой текст пользователя — аккуратно чистим
    const D = getDef(d.lang);
    if (s === D.invite.text[d.event] && D.invite.hidden[d.event]) s = D.invite.hidden[d.event];
    s = s.replace(/ менен (келинибиз )?\{bride\}/g, '').replace('жатышат', 'жатат').replace('кыйдырышты', 'кыйдырды')
      .replace(/наших детей — \{groom\} и \{bride\}/g, 'нашего сына {groom}').replace(/ и \{bride\}/g, '').replace(/\{bride\}/g, '');
  }
  const groom = d.nameMode === 'initials' ? ((d.groom || '').trim()[0] || '') + '.' : d.groom || '';
  return fill(s, { groom, bride: d.bride || '' });
}

/* ───────────────────────── секции ───────────────────────── */
const H = (title) => (title ? `<h2 class="h">${esc(title)}</h2>` : '');

function section(b, d, t, L, opts) {
  const p = parts(d);
  switch (b.type) {
    case 'bismillah':
      return `<section class="s s-bism rv"><p class="ar bism" lang="ar" dir="rtl">${BISMILLAH}</p></section>`;
    case 'cover': {
      const title = b.title || L.events[d.event] || L.events.toy;
      const dateLine = p ? `${String(p.day).padStart(2, '0')} · ${String(p.m).padStart(2, '0')} · ${p.y}` : '';
      const art = t.cover === 'arch' ? ARCH + `<div class="fin">${ARCH_TOP}</div>` : t.cover === 'medallion' ? MEDALLION : t.cover === 'plate' ? PLATE : t.cover === 'frame' ? '<div class="frame"><i></i><i></i><i></i><i></i></div>' : '';
      const lan = t.lanterns ? `<div class="lanterns">${LANTERN(14, 40, 0.8)}${LANTERN(80, 70, 1)}${LANTERN(66, 20, 0.6)}</div>` : '';
      const round = t.cover === 'plate' || t.cover === 'medallion';
      return `<section class="s s-cover cv-${t.cover}">${lan}${round ? `<p class="cv-kicker cv-out">${esc(title)}</p>` : ''}<div class="cv-box">${art}<div class="cv-text">
        ${t.mono ? `<p class="cv-ar" lang="ar" dir="rtl">بَارَكَ اللَّهُ لَكُمَا</p>` : ''}${round ? '' : `<p class="cv-kicker">${esc(title)}</p>`}<h1 class="names${kg((d.groom || '') + (d.bride || ''))}">${namesHtml(d)}</h1>${divider()}<p class="cv-date">${dateLine}</p>
        ${p ? `<p class="cv-wd">${L.weekdays[p.wdIdx]} · ${esc(d.time || '')}</p>` : ''}</div></div>
        ${opts.thumb ? '' : '<div class="scroll" aria-hidden="true"><span></span></div>'}</section>`;
    }
    case 'ayah': {
      const a = AYAHS[b.which] || AYAHS.rum21;
      return `<section class="s s-ayah rv"><div class="card">${divider()}<p class="ar" lang="ar" dir="rtl">${a.ar}</p>
        <p class="tr">«${esc(ayahText(a, d.lang))}»</p><p class="ref">${esc(ayahRef(a, d.lang))}</p></div></section>`;
    }
    case 'invite':
      return `<section class="s rv"><div class="card">${H(b.title)}<p class="lead">${nl(inviteText(b.text, d))}</p></div></section>`;
    case 'hosts':
      return `<section class="s rv">${H(b.title)}<p class="hosts">${nl(b.text)}</p></section>`;
    case 'date': {
      if (!p) return '';
      const gc = gcalUrl(d, coupleTitle(d) + ' — ' + (L.events[d.event] || ''), venuePlace(d));
      return `<section class="s rv"><div class="card">${H(b.title)}
        <div class="bigdate"><span class="wd">${L.weekdays[p.wdIdx]}</span><span class="dn">${p.day}</span><span class="mo">${L.months[p.m - 1]} · ${p.y}</span></div>
        <p class="tm">${L.time} <b>${esc(d.time || '')}</b></p>
        ${b.calendar ? calendarHtml(p, L) : ''}
        ${gc && !opts.thumb ? `<a class="btn ghost" href="${esc(gc)}" target="_blank" rel="noopener">${L.addCal}</a>` : ''}</div></section>`;
    }
    case 'sessions': {
      const row = (who, time, txt, extra) => `<div class="ses"><p class="ses-w">${who}</p><p class="ses-t">${esc(time)}</p>${txt ? `<p class="ses-x">${esc(txt)}</p>` : ''}${extra || ''}</div>`;
      const rows = [b.men && b.menTime ? row(L.men, b.menTime, b.menText) : '', b.women && b.womenTime ? row(L.women, b.womenTime, b.womenText, b.tugunsiz ? `<p class="ses-n">${esc(L.tugunsiz)}</p>` : '') : ''].filter(Boolean);
      if (!rows.length) return '';
      return `<section class="s rv">${H(b.title)}<div class="sess">${rows.join('')}</div></section>`;
    }
    case 'countdown':
      if (!p) return '';
      return `<section class="s rv"><p class="kick">${L.cd}</p><div class="cd" data-cd>${L.cdUnits.map((u, i) => `<div><b data-u="${i}">00</b><span>${u}</span></div>`).join('')}</div></section>`;
    case 'program': {
      const items = (b.items || []).filter((x) => x.time || x.text);
      if (!items.length) return '';
      return `<section class="s rv"><div class="card">${H(b.title)}<ol class="prog">${items.map((x) => `<li><b>${esc(x.time)}</b><span>${esc(x.text)}</span></li>`).join('')}</ol></div></section>`;
    }
    case 'venue': {
      const q = [b.place, b.address].filter(Boolean).join(', ');
      const link = safeUrl(b.map);
      const maps = link ? `<a class="btn" href="${esc(link)}" target="_blank" rel="noopener">${L.mapOpen}</a>`
        : q ? `<div class="maps">${MARKETS[marketOf(d)].maps.map((m, i) => `<a class="btn${i ? ' ghost' : ''}" href="${MAP_URL[m](q)}" target="_blank" rel="noopener">${MAP_NAME[m]}</a>`).join('')}</div>` : '';
      return `<section class="s rv"><div class="card">${H(b.title)}<svg class="v-ic" viewBox="0 0 48 48" aria-hidden="true"><path d="M6 44V22c0-6 8-10 18-18 10 8 18 12 18 18v22z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M18 44V30a6 6 0 0 1 12 0v14" fill="none" stroke="currentColor" stroke-width="1.4"/><polygon points="${star8(24, 18, 3.4, 1.7)}" fill="currentColor"/></svg>
        ${b.place ? `<p class="place">${esc(b.place)}</p>` : ''}${b.address ? `<p class="addr">${nl(b.address)}</p>` : ''}${opts.thumb ? '' : maps}</div></section>`;
    }
    case 'rules': {
      const items = (b.items || []).filter((k) => L.rules[k]);
      if (!items.length && !b.note) return '';
      return `<section class="s rv">${H(b.title)}<ul class="rules">${items.map((k) => `<li>${icon(k)}<span>${L.rules[k]}</span></li>`).join('')}</ul>${b.note ? `<p class="note">${nl(b.note)}</p>` : ''}</section>`;
    }
    case 'dress': {
      const cols = (b.colors || []).filter((c) => /^#[0-9a-f]{6}$/i.test(c)).slice(0, 5);
      return `<section class="s rv"><div class="card">${H(b.title)}${b.text ? `<p>${nl(b.text)}</p>` : ''}${cols.length ? `<div class="sw">${cols.map((c) => `<i style="background:${c}"></i>`).join('')}</div>` : ''}</div></section>`;
    }
    case 'contacts': {
      const items = (b.items || []).filter((x) => x.phone || x.name);
      if (!items.length) return '';
      return `<section class="s rv">${H(b.title)}<div class="contacts">${items.map((x) => {
        const digits = String(x.phone || '').replace(/\D/g, '');
        return `<div class="ct"><p class="ct-n">${esc(x.name)}</p><p class="ct-p">${esc(x.phone)}</p>${digits && !opts.thumb ? `<div class="maps"><a class="btn" href="tel:+${digits}">${L.call}</a><a class="btn ghost" href="https://wa.me/${digits}" target="_blank" rel="noopener">WhatsApp</a></div>` : ''}</div>`;
      }).join('')}</div></section>`;
    }
    case 'rsvp':
      return `<section class="s rv" id="rsvp"><div class="card">${H(b.title)}${b.deadline ? `<p class="muted">${esc(b.deadline)}</p>` : ''}
        <form class="rsvp" data-rsvp novalidate>
          <input name="name" maxlength="80" placeholder="${L.rsvpName}" autocomplete="name">
          <div class="seg"><label><input type="radio" name="att" value="1" checked><span>${L.rsvpYes}</span></label><label><input type="radio" name="att" value="0"><span>${L.rsvpNo}</span></label></div>
          ${b.count ? `<div class="cnt" data-cnt><span>${L.rsvpCount}</span><div><button type="button" data-d="-1" aria-label="−">−</button><output>1</output><button type="button" data-d="1" aria-label="+">+</button></div></div>` : ''}
          <textarea name="msg" maxlength="500" rows="3" placeholder="${L.rsvpMsg}"></textarea>
          <button class="btn wide" type="submit">${L.rsvpSend}</button><p class="r-msg" role="status"></p>
        </form></div></section>`;
    case 'text':
      if (!b.title && !b.text) return '';
      return `<section class="s rv"><div class="card">${H(b.title)}${b.text ? `<p>${nl(b.text)}</p>` : ''}</div></section>`;
    case 'final':
      return `<section class="s s-final rv">${divider()}<p class="fin-t${kg(b.text)}">${esc(b.text || '')}</p><p class="fin-n">${namesHtml(d)}</p></section>`;
    default:
      return '';
  }
}
const MAP_URL = { '2gis': (q) => `https://2gis.kg/search/${enc(q)}`, google: (q) => `https://www.google.com/maps/search/?api=1&query=${enc(q)}`, yandex: (q) => `https://yandex.uz/maps/?text=${enc(q)}` };
const MAP_NAME = { '2gis': '2ГИС', google: 'Google', yandex: 'Yandex' };
function venuePlace(d) {
  const v = (d.blocks || []).find((b) => b.type === 'venue' && b.on);
  return v ? [v.place, v.address].filter(Boolean).join(', ') : '';
}

// Single-weight fonts break with ital/wght axes: normalize per family
const SINGLE = new Set(['Great Vibes', 'Bad Script', 'Prata', 'Forum', 'Yeseva One', 'Philosopher', 'Marmelad']);
function fontsHrefSafe(themes) {
  const map = new Map([['Amiri', 'wght@400;700']]);
  for (const t of themes) for (const [role, n] of Object.entries(t.f)) {
    if (NO_KG.has(n)) map.set('Cormorant Garamond', 'ital,wght@0,400;0,500;0,600;1,400;1,500');
    if (SINGLE.has(n)) { map.set(n, ''); continue; }
    if (role === 'display') map.set(n, 'ital,wght@0,400;0,500;0,600;1,400');
    else if (!map.has(n)) map.set(n, 'wght@400;500;600');
    else if (n === 'Cormorant Garamond' && role !== 'display') map.set(n, 'ital,wght@0,400;0,500;0,600;1,400;1,500');
  }
  return 'https://fonts.googleapis.com/css2?' + [...map].map(([n, w]) => 'family=' + n.replace(/ /g, '+') + (w ? ':' + w : '')).join('&') + '&display=swap';
}

function themeVars(t) {
  const c = t.c;
  return `:root{--bg:${c.bg};--bg2:${c.bg2};--sf:${c.surface};--ink:${c.ink};--mu:${c.muted};--ac:${c.accent};--ac2:${c.accent2};--ln:${c.line};
  --fd:'${t.f.display}',serif;--fs:'${t.f.script}',cursive;--fb:'${t.f.body}',serif;--fa:'Amiri',serif;--pat:${patternCss(t)};--fx:${t.fx || 'none'};--btn-ink:${t.dark ? c.bg : '#fff'}}`;
}

// opts: { mode: 'live'|'preview'|'thumb', slug, api, botUrl, base }
function renderInviteV1(d, opts = {}) {
  let t = themeById(d.theme);
  // в узбекской кириллице нет ҳ у некоторых заголовочных шрифтов — подменяем на Cormorant
  if (d.lang === 'uzc' && NO_UZC.has(t.f.display)) t = { ...t, f: { ...t.f, display: 'Cormorant Garamond' } };
  if (d.lang === 'uzc' && NO_UZC.has(t.f.body)) t = { ...t, f: { ...t.f, body: 'Lora' } };
  _t = t;
  const L = L_(d.lang);
  const thumb = opts.mode === 'thumb';
  const o = { ...opts, thumb };
  const blocks = (d.blocks || []).filter((b) => b.on && BLOCKS[b.type]);
  const body = blocks.map((b) => section(b, d, t, L, o)).join('\n');
  const title = coupleTitle(d) || 'Walima';
  const p = parts(d);
  const desc = `${L.events[d.event] || ''}${p ? ' · ' + String(p.day).padStart(2, '0') + '.' + String(p.m).padStart(2, '0') + '.' + p.y : ''}`;
  const sealSvg = `<svg viewBox="0 0 100 100"><polygon points="${star8(50, 50, 48, 40)}" fill="var(--bg2)" stroke="currentColor" stroke-width="1.2"/><polygon points="${star8(50, 50, 38, 32)}" fill="none" stroke="currentColor" stroke-width=".7"/><circle cx="50" cy="50" r="22" fill="currentColor" opacity=".14"/><text x="50" y="58" text-anchor="middle" font-family="${kg(initials(d)) ? 'Cormorant Garamond' : t.f.script}"${kg(initials(d)) ? ' font-style="italic"' : ''} font-size="26" fill="currentColor">${esc(initials(d))}</text></svg>`;
  const doors = !thumb && d.intro !== false ? `<div id="doors" role="button" tabindex="0" aria-label="${L.open}"><div class="d l"></div><div class="d r"></div><div class="seal"><b>${sealSvg}</b><small>${L.tapHint}</small></div></div>` : '';
  const cfg = { slug: opts.slug || '', api: opts.api || '', mode: opts.mode || 'live', date: d.date, time: d.time, tz: MARKETS[marketOf(d)].tz, L: { thanks: L.rsvpThanks, again: L.rsvpAgain, prev: L.rsvpPreview, need: L.rsvpNeedName, err: L.rsvpErr, done: L.cdDone } };
  const foot = thumb ? '' : `<footer class="foot">${L.madeWith} · <a href="${esc(opts.botUrl || '#')}" target="_blank" rel="noopener">Walima — ${L.makeOwn}</a></footer>`;
  const og = opts.base ? `<meta property="og:title" content="${esc(title)}"><meta property="og:description" content="${esc(desc)}"><meta property="og:type" content="website">${opts.slug ? `<meta property="og:image" content="${esc(opts.base)}/og/${marketOf(d)}-${esc(t.id)}.jpg"><meta property="og:url" content="${esc(opts.base)}/i/${esc(opts.slug)}">` : ''}` : '';
  return `<!doctype html><html lang="${{ ru: 'ru', ky: 'ky', uz: 'uz', uzc: 'uz-Cyrl' }[d.lang] || 'uz'}"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>${esc(title)} — ${esc(L.events[d.event] || '')}</title><meta name="description" content="${esc(desc)}"><meta name="theme-color" content="${t.c.bg}">${og}
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="${fontsHrefSafe([t])}">
<style>${themeVars(t)}${BASE_CSS}</style></head>
<body class="t-${t.id} card-${t.card}${t.mono ? ' mono' : ''}${t.minimal ? ' minimal' : ''}${t.folk ? ' folk' : ''}${thumb ? ' thumb' : ''}">
${doors}<main class="inv">${body}</main>${foot}
${thumb ? '' : `<script>window.WALIMA=${JSON.stringify(cfg).replace(/</g, '\\u003c')};<\/script><script>${CLIENT_JS}<\/script>`}
</body></html>`;
}
function initials(d) {
  const g = (d.groom || '').trim()[0] || '', b = (d.bride || '').trim()[0] || '';
  if (d.nameMode === 'groom' || !b) return g;
  if (BRIDE_EVENTS.has(d.event)) return b;
  return g + '&' + b;
}

  return r.sort((x, y) => x.time.localeCompare(y.time));

const mins = (t) => { const [h, m] = String(t).split(':').map(Number); return (h || 0) * 60 + (m || 0); };
// точка на дуге: 05:00 — левый край (рассвет), 21:00 — правый (закат)
const dayFrac = (t) => Math.max(0.04, Math.min(0.96, (mins(t) - 300) / 960));

/* ───────────── секции ───────────── */
function section(b, d, t, L, g, o, ctx) {
  const F = fmtDate(d);
  switch (b.type) {
    case 'bismillah':
      return ''; // басмала — часть обложки
    case 'cover': {
      const ev = b.title || L.events[d.event] || L.events.toy;
      const bism = ctx.bism ? `<p class="bism" lang="ar" dir="rtl">${BISMILLAH}</p>` : '';
      const round = t.cover === 'plate' || t.cover === 'medallion';
      const namesPart = t.cover === 'monogram' ? `${monogramSvg(d)}<p class="mono-n${kg((d.groom || '') + (d.bride || ''))}">${namesLine(d)}</p>`
        : t.cover === 'editorial' ? `<h1 class="ed-n">${namesLine(d).split(' <span>&amp;</span> ').map((x, i) => `<span class="ln"><span style="--i:${i}">${x}</span></span>`).join('<span class="ln amp"><span style="--i:1">&amp;</span></span>')}</h1>`
        : namesSvg(d, t);
      return `<section class="cv cv-${t.cover}" data-cv>${bism}${round ? `<p class="cv-ev out">${esc(ev)}</p>` : ''}<div class="cv-box">${coverFrame(t)}<div class="cv-in">
        ${t.mono ? '<p class="cv-ar" lang="ar" dir="rtl">بَارَكَ اللَّهُ لَكُمَا</p>' : ''}${round ? '' : `<p class="cv-ev">${esc(ev)}</p>`}${namesPart}
        ${F ? `<p class="cv-date">${esc(F.day)}, ${F.year}</p><p class="cv-wd">${esc(F.wd)}, ${ctx.rows.length > 1 ? ctx.rows.map((x) => `${esc(x.who.toLowerCase())} ${esc(x.time)}`).join(', ') : `${esc(g.at)} ${esc(d.time || '')}`}</p>` : ''}</div></div>
        ${o.thumb ? '' : `<div class="hint" aria-hidden="true">${esc(g.scroll)}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>`}</section>`;
    }
    case 'ayah': {
      const a = AYAHS[b.which] || AYAHS.rum21;
      const words = a.ar.split(' ').map((w) => `<span>${w}</span>`).join(' ');
      return `<section class="ay" data-scrub="ay"><svg class="ay-orn" viewBox="0 0 120 24" aria-hidden="true"><path d="M0 12H46M74 12H120"/><polygon points="${star8(60, 12, 10, 6)}"/></svg>
        <p class="ay-ar" lang="ar" dir="rtl">${words}</p><p class="ay-tr">${esc(ayahText(a, d.lang))}</p><p class="ay-ref">${esc(ayahRef(a, d.lang))}</p></section>`;
    }
    case 'invite': {
      const hosts = ctx.hosts;
      return `<section class="lt"><div class="paper" data-in>${b.title ? `<p class="lt-to">${esc(b.title)}</p>` : ''}
        <p class="lt-body">${nl(inviteText(b.text, d))}</p>
        ${hosts ? `<p class="lt-sign"><span>${esc(hosts.title || g.sign)}</span><b class="${kg(hosts.text).trim()}">${nl(hosts.text)}</b></p>` : ''}</div></section>`;
    }
    case 'hosts':
      return ctx.hostsInLetter ? '' : `<section class="hs"><p class="lt-sign"><span>${esc(b.title || g.sign)}</span><b>${nl(b.text)}</b></p></section>`;
    case 'date': {
      if (!F) return '';
      const gc = gcalUrl(d, coupleTitle(d) + ' — ' + (L.events[d.event] || ''), ctx.place);
      return `<section class="dt">${b.title ? `<h2 class="h">${esc(b.title)}</h2>` : ''}<div class="dt-row">
        <div class="leaf" data-in><div class="rings"><i></i><i></i></div><p class="lf-m">${esc(F.month)} ${F.year}</p><p class="lf-d">${F.p.day}</p><p class="lf-w">${esc(F.wd)}</p>
          <svg class="stamp" viewBox="0 0 80 80" aria-hidden="true"><polygon points="${star8(40, 40, 38, 31)}"/><polygon points="${star8(40, 40, 29, 23)}" class="st-in"/><circle cx="40" cy="40" r="6" class="st-dot"/></svg></div>
        <div class="dt-side">${ctx.rows.length > 1 ? `<div class="dt-rows">${ctx.rows.map((x) => `<p><span>${esc(x.who)}</span><b>${esc(x.time)}</b></p>`).join('')}</div>` : `<p class="dt-t">${esc(g.at)}</p><p class="dt-h">${esc(d.time || '')}</p>`}
          ${gc && !o.thumb ? `<a class="lnk" href="${esc(gc)}" target="_blank" rel="noopener">${icon('cal')}${esc(g.addCal)}</a>` : ''}</div></div>
        ${b.calendar ? calendarHtml(F.p, L) : ''}</section>`;
    }
    case 'sessions': {
      const rows = ctx.rows;
      if (!rows.length) return '';
      // дуга дня: отметки на своих местах по времени, солнце проходит их по очереди
      const P = (f) => { const t2 = f, x = (1 - t2) ** 2 * 24 + 2 * (1 - t2) * t2 * 170 + t2 ** 2 * 316, y = (1 - t2) ** 2 * 140 + 2 * (1 - t2) * t2 * -40 + t2 ** 2 * 140; return [x.toFixed(1), y.toFixed(1)]; };
      const marks = rows.map((r) => { const [x, y] = P(dayFrac(r.time)); return `<g class="mk mk-${r.cls}"><circle cx="${x}" cy="${y}" r="5"/><text x="${x}" y="${(+y - 12).toFixed(1)}" text-anchor="middle">${esc(r.time)}</text></g>`; }).join('');
      const arc = rows.length > 1 ? `<svg class="sky" viewBox="0 0 340 150" aria-hidden="true" data-from="${dayFrac(rows[0].time)}" data-to="${dayFrac(rows[rows.length - 1].time)}">
        <path d="M24 140Q170 -40 316 140" class="sky-p" id="skyp"/>${marks}
        <g class="sun"><circle r="10"/>${Array.from({ length: 8 }, (_, i) => `<path d="M0 -15V-20" transform="rotate(${45 * i})"/>`).join('')}</g>
        <path d="M0 146H340" class="sky-h"/></svg>` : '';
      const col = (r) => `<div class="ss-c ${r.cls}"><p class="ss-w">${esc(r.who)}</p><p class="ss-t">${esc(r.time)}</p>${r.text ? `<p class="ss-x">${esc(r.text)}</p>` : ''}${r.note ? `<p class="ss-n">${esc(r.note)}</p>` : ''}</div>`;
      return `<section class="ss" data-scrub="sun">${b.title ? `<h2 class="h">${esc(b.title)}</h2>` : ''}${arc}<div class="ss-row n${rows.length}">${rows.map(col).join('')}</div></section>`;
    }
    case 'countdown':
      if (!F) return '';
      return `<section class="cd-s"><p class="cd-k">${esc(L.cd)}</p><div class="cd" data-cd>${L.cdUnits.map((u, i) => `<div><b data-u="${i}">0</b><span>${esc(u)}</span></div>`).join('')}</div></section>`;
    case 'program': {
      const items = (b.items || []).filter((x) => x.time || x.text);
      if (!items.length) return '';
      return `<section class="pg" data-scrub="tl">${b.title ? `<h2 class="h">${esc(b.title)}</h2>` : ''}<div class="tl"><i class="tl-line"><i></i></i>
        ${items.map((x) => `<div class="tl-it"><b>${esc(x.time)}</b><span>${esc(x.text)}</span></div>`).join('')}</div></section>`;
    }
    case 'venue': {
      const q = [b.place, b.address].filter(Boolean).join(', ');
      const link = safeUrl(b.map);
      const mk = MARKETS[marketOf(d)];
      const btns = o.thumb ? '' : link ? `<a class="btn" href="${esc(link)}" target="_blank" rel="noopener">${icon('route')}${esc(g.route)}</a>`
        : q ? mk.maps.map((m, i) => `<a class="btn${i ? ' ghost' : ''}" href="${MAP_URL[m](q)}" target="_blank" rel="noopener">${i ? '' : icon('route')}${MAP_NAME[m]}</a>`).join('') : '';
      return `<section class="vn">${b.title ? `<h2 class="h">${esc(b.title)}</h2>` : ''}<div class="vn-card" data-in><div class="map">${mapSvg(q)}
        <svg class="pin" viewBox="0 0 40 52" aria-hidden="true"><path d="M20 51C20 51 2 32 2 19A18 18 0 0 1 38 19C38 32 20 51 20 51Z"/><polygon points="${star8(20, 19, 8, 4.5)}" class="pin-s"/></svg><i class="pulse"></i></div>
        <div class="vn-b">${b.place ? `<p class="vn-p">${esc(b.place)}</p>` : ''}${b.address ? `<p class="vn-a">${nl(b.address)}</p>` : ''}<div class="btns">${btns}</div></div></div></section>`;
    }
    case 'rules': {
      const items = (b.items || []).filter((k) => L.rules[k]);
      if (!items.length && !b.note) return '';
      return `<section class="ru">${b.title ? `<h2 class="h">${esc(b.title)}</h2>` : ''}<ul class="chips">${items.map((k) => `<li>${icon(k)}<span>${esc(L.rules[k])}</span></li>`).join('')}</ul>${b.note ? `<p class="note">${nl(b.note)}</p>` : ''}</section>`;
    }
    case 'dress': {
      const cols = (b.colors || []).filter((c) => /^#[0-9a-f]{6}$/i.test(c)).slice(0, 5);
      return `<section class="dr-s">${b.title ? `<h2 class="h">${esc(b.title)}</h2>` : ''}${b.text ? `<p class="txt">${nl(b.text)}</p>` : ''}${cols.length ? `<div class="sw">${cols.map((c, i) => `<i style="background:${c};--i:${i}"></i>`).join('')}</div>` : ''}</section>`;
    }
    case 'contacts': {
      const items = (b.items || []).filter((x) => x.phone || x.name);
      if (!items.length) return '';
      return `<section class="ct">${b.title ? `<h2 class="h">${esc(b.title)}</h2>` : ''}${items.map((x) => {
        const dg = String(x.phone || '').replace(/\D/g, '');
        return `<div class="ct-r"><div><p class="ct-n">${esc(x.name)}</p><p class="ct-p">${esc(x.phone)}</p></div>${dg && !o.thumb ? `<div class="ct-b"><a href="tel:+${dg}" aria-label="${esc(g.call)}">${icon('phone')}</a><a href="https://t.me/+${dg}" target="_blank" rel="noopener" aria-label="Telegram">${icon('tg')}</a></div>` : ''}</div>`;
      }).join('')}</section>`;
    }
    case 'rsvp':
      return `<section class="rs" id="rsvp">${b.title ? `<h2 class="h">${esc(b.title)}</h2>` : ''}${b.deadline ? `<p class="note">${esc(b.deadline)}</p>` : ''}
        <form class="rsf" data-rsvp novalidate><div class="rs-ch"><button type="button" class="big y" data-att="1">${esc(g.yes)}</button><button type="button" class="big n" data-att="0">${esc(g.no)}</button></div>
        <div class="rs-more"><label class="fl"><span>${esc(g.yourName)}</span><input name="name" maxlength="80" autocomplete="name"></label>
          ${b.count ? `<div class="cnt" data-cnt><span>${esc(g.count)}</span><div><button type="button" data-d="-1" aria-label="−">−</button><output>1</output><button type="button" data-d="1" aria-label="+">+</button></div></div>` : ''}
          <label class="fl"><span>${esc(g.duo)}</span><textarea name="msg" maxlength="500" rows="3"></textarea></label>
          <button class="btn wide" type="submit">${esc(g.send)}</button><p class="r-msg" role="status"></p></div>
        ${o.thumb ? '' : `<p class="rs-priv">${esc(g.privA)} <a href="/maxfiylik" target="_blank" rel="noopener">${esc(g.privB)}</a></p>`}
        <div class="rs-done"><svg viewBox="0 0 80 80" aria-hidden="true"><polygon points="${star8(40, 40, 36, 28)}"/><path d="M27 41l9 9 17-19"/></svg><p class="rs-t"></p><button type="button" class="again">${esc(g.change)}</button></div></form></section>`;
    case 'text':
      if (!b.title && !b.text) return '';
      return `<section class="tx">${b.title ? `<h2 class="h">${esc(b.title)}</h2>` : ''}${b.text ? `<p class="txt">${nl(b.text)}</p>` : ''}</section>`;
    case 'final':
      return `<section class="fn"><svg class="fn-orn" viewBox="0 0 200 40" aria-hidden="true"><path d="M0 20H80M120 20H200"/><polygon points="${star8(100, 20, 16, 10)}"/></svg>
        <p class="fn-t${kg(b.text)}">${esc(b.text || '')}</p>${namesSvg(d, t).replace('class="nm', 'class="nm sm')}</section>`;
    default:
      return '';
  }
}

// Кайма для обложки «band»: тот же узор темы, но яркий
function bandPat(t) {
  if (!['adras', 'chapan', 'gilam', 'paxtagul'].includes(t.pattern)) return 'none';
  return patternCss(t).replace(/opacity%3D'\.\d+'/, "opacity%3D'.95'").replace(/opacity='\.\d+'/, "opacity='.95'");
}

function dwellWatch(root, sel, reset) {
  const t = new Map();
  addEventListener('message', (e) => { if (e.data !== 'walima-opened') return; root.querySelectorAll(sel + ' iframe').forEach((f) => { if (f.contentWindow === e.source) f.dataset.opened = '1'; }); });

    const f = e.target.querySelector('iframe'); if (!f) return;
    clearTimeout(t.get(f));
    if (e.intersectionRatio >= 0.75) t.set(f, setTimeout(() => { try { f.contentWindow?.postMessage('walima-open', '*'); } catch {} }, 4000));
    else if (e.intersectionRatio < 0.3 && f.dataset.opened) { delete f.dataset.opened; reset(f); }
  }), { root, threshold: [0, 0.3, 0.75] });
  root.querySelectorAll(sel).forEach((s) => io.observe(s));
  return io;
}

}
$('#dash').addEventListener('click', async (e) => {
  const c = e.target.closest('[data-copy]'), s = e.target.closest('[data-share]'), del = e.target.closest('[data-del]');
  if (c) { const u = linkFor(c.dataset.copy); try { await navigator.clipboard.writeText(u); toast(t('copy')); } catch { toast(u); } return; }
  if (s) {
    const u = linkFor(s.dataset.share), text = `${coupleTitle(st.data)} — ${L_(st.data.lang).events[st.data.event] || ''}`;
    if (tgApp?.openTelegramLink && initData) return tgApp.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(u)}&text=${encodeURIComponent(text)}`);
    if (navigator.share) return navigator.share({ title: text, url: u }).catch(() => {});
    location.href = `https://wa.me/?text=${encodeURIComponent(text + '\n' + u)}`; return;
  }
  if (del) { st.data.guests.splice(+del.dataset.del, 1); save(); syncGuests(); renderDash(); return; }
  if (e.target.closest('#gadd')) { const v = $('#gname').value.trim(); if (!v) return; (st.data.guests ||= []).unshift(v); save(); syncGuests(); renderDash(); haptic(); return; }
  const pv = e.target.closest('[data-pv]'); if (pv) { openPreview(st.data, false, pv.dataset.pv); return; }
  if (e.target.closest('#d-open')) { if (window.WALIMA_DEMO) openPreview(st.data, false); else window.open(linkFor(), '_blank'); return; }
  if (e.target.closest('#d-edit')) { step = 0; renderStep(); go('s-wiz'); return; }
  if (e.target.closest('[data-keep]')) { const u = restoreLink(); try { await navigator.clipboard.writeText(u); toast(t('copy')); } catch { toast(u); } return; }
  if (e.target.closest('#d-del')) { openSheet(`<div class="grab"></div><h2>${escA(t('delT'))}</h2><p class="hint" style="margin:8px 0 18px">${escA(t('delQ'))}</p><div style="display:flex;gap:10px"><button class="btn ghost grow" id="delno">${escA(t('delNo'))}</button><button class="btn grow" id="delyes" style="background:#c0392b;color:#fff">${escA(t('delYes'))}</button></div>`); return; }
  if (e.target.closest('#d-new')) { go('s-hello'); }
});
$('#dash').addEventListener('keydown', (e) => { if (e.target.id === 'gname' && e.key === 'Enter') $('#gadd').click(); });
// список гостей храним вместе с приглашением, чтобы он был и на другом телефоне
let syncT; function syncGuests() { clearTimeout(syncT); syncT = setTimeout(() => fetch(`/api/invites/${st.slug}`, { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ data: st.data, initData, key: st.key }) }).catch(() => {}), 600); }

/* ───────── старт ───────── */
applyLang(); drawRosette();
$('#mine-link').classList.toggle('hide', !st.slug);
const rs = QP.get('s'), rk = QP.get('key');
if (rs && rk && /^[a-z0-9-]{3,60}$/.test(rs)) {
  go('s-hello');
  fetch(`/api/invites/${rs}?key=${encodeURIComponent(rk)}`).then(async (r) => {
    const j = await r.json(); if (!r.ok) throw 0;
    st = { side: j.data.side || null, event: j.data.event || null, data: j.data, slug: j.slug, key: j.key || rk, url: location.origin + '/i/' + j.slug };
    save(); history.replaceState(null, '', location.pathname);
    $('#mine-link').classList.remove('hide'); renderDash(); go('s-dash');
  }).catch(() => { toast(t('err')); if (st.slug) { $('#mine-link').classList.remove('hide'); } });
} else if (st.slug) { renderDash(); go('s-dash'); } else go('s-hello');
</script>
